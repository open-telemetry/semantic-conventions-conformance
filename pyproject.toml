[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "semconv-conformance"
version = "0.1.0"
description = "Semantic conventions conformance framework"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff==0.15.11",
  "mypy==1.20.1",
]

[project.scripts]
http-run-scenario = "semconv_conformance.http.run_scenario_cli:main"
semconv-ci-matrix = "semconv_conformance.ci_matrix:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["semconv_conformance*"]

[tool.setuptools.package-data]
semconv_conformance = ["languages.json"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
  ".cache",
  ".ruff_cache",
]

[tool.ruff.lint]
select = ["B", "BLE", "E4", "E7", "E9", "F", "I", "PIE", "RUF", "SIM", "UP", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["src", ".github/scripts"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
