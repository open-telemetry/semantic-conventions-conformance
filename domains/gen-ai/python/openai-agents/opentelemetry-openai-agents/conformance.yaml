runner: genai-conformance
instrumented_library: openai-agents
instrumentation_library: opentelemetry-instrumentation-genai-openai-agents

server:
  run: genai-mock-server --port ${PORT}

env:
  OPENAI_BASE_URL: ${MOCK_SERVER_URL}/v1
  OPENAI_API_KEY: test_openai_api_key
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: SPAN_AND_EVENT

# A run prints `[non-fatal] Tracing client error 401`: the Agents SDK still
# ships its own traces to api.openai.com. Only disable_openai_trace_export=True
# removes that exporter and zero-code cannot pass it, while disabling the SDK's
# tracing would remove the pipeline the instrumentation hooks into.

scenarios:
  invoke_agent:
    run: uv run --frozen --project . opentelemetry-instrument python ../scenarios/invoke_agent.py

  automatic_tool_calling:
    run: uv run --frozen --project . opentelemetry-instrument python ../scenarios/automatic_tool_calling.py
