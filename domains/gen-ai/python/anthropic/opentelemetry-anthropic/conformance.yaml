runner: genai-conformance
instrumented_library: anthropic
instrumentation_library: opentelemetry-instrumentation-genai-anthropic

server:
  run: genai-mock-server --port ${PORT}

env:
  ANTHROPIC_BASE_URL: ${MOCK_SERVER_URL}
  ANTHROPIC_API_KEY: test_anthropic_api_key
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: SPAN_AND_EVENT

scenarios:
  inference:
    run: uv run --frozen --project . opentelemetry-instrument python ../scenarios/inference.py

  streaming:
    run: uv run --frozen --project . opentelemetry-instrument python ../scenarios/streaming.py

  tool_calling:
    run: uv run --frozen --project . opentelemetry-instrument python ../scenarios/tool_calling.py

  automatic_tool_calling:
    run: uv run --frozen --project . opentelemetry-instrument python ../scenarios/automatic_tool_calling.py

  multimodal:
    run: uv run --frozen --project . opentelemetry-instrument python ../scenarios/multimodal.py
