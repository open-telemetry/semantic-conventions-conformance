runner: http-conformance
instrumented_library: express
instrumentation_library: "@opentelemetry/instrumentation-express"

setup: otel-conformance-js install

scenario_contract: ../../../../../../tools/http/contracts/server.yaml
scenario_run: otel-http-drive --serve node ../server.js

# The Express instrumentation spans each middleware and route handler it
# dispatches, so how many there are follows the application's own layering
# rather than anything the contract asked for.
additional_spans:
  - match:
      kind: INTERNAL
