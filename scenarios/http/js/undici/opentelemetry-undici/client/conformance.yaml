runner: http-conformance
instrumented_library: undici
instrumentation_library: "@opentelemetry/instrumentation-undici"

setup: otel-conformance-js install

# The mock server answers the same contract, so what this package measures is
# the sending; its base URL arrives as ${MOCK_SERVER_URL}.
server:
  run: http-mock-server --port ${PORT}

scenarios:
  client:
    run: node ../client.js
    expected_violations:
      # Both are the instrumentation's, not the scenario's: the requests it
      # sends carry the information it would need for either.
      - id: error_type_missing_on_error
        context:
          status_code: error
        reason: >-
          @opentelemetry/instrumentation-undici sets a span's status to error
          for a 4xx or 5xx response but never sets error.type, which semantic
          conventions require whenever an HTTP client span reports an error.
      - id: recommended_attribute_not_present
        context:
          attribute_key: network.protocol.version
          kind: client
        reason: >-
          @opentelemetry/instrumentation-undici does not record
          network.protocol.version, so nothing distinguishes an HTTP/1.1
          request from an HTTP/2 one.
