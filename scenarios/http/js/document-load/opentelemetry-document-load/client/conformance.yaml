runner: http-conformance
instrumented_library: browser document load
instrumentation_library: "@opentelemetry/instrumentation-document-load"

setup: otel-conformance-js install --browser chromium

server:
  run: http-mock-server --port ${PORT}

scenarios:
  client:
    run: node ../client.js
    # DocumentLoadInstrumentation emits documentFetch, resourceFetch, and
    # documentLoad as INTERNAL spans. They do not carry http.request.method and
    # therefore are intentionally outside the HTTP client/server reducer.
    spans:
      - match:
          kind: internal
        expect:
          count: 4
          attributes:
            url.full:
              present: true
