runner: http-conformance
instrumented_library: Microsoft.AspNetCore
instrumentation_library: OpenTelemetry.Instrumentation.AspNetCore

# Publishing here rather than in `run:` keeps the toolchain out of the measured
# process: a `dotnet run` would restore and compile on the clock.
setup: otel-conformance-dotnet build

scenarios:
  server:
    # The requests are sent from outside the scenario, so a server run holds
    # server telemetry only; the driver starts this command, chooses the port
    # it binds, and closes its standard input when it is done.
    run: otel-http-drive --serve otel-conformance-dotnet run
