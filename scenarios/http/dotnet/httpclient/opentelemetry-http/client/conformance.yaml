runner: http-conformance
instrumented_library: System.Net.Http
instrumentation_library: OpenTelemetry.Instrumentation.Http

setup: dotnet publish ../OpenTelemetryHttpClient.csproj --configuration Release --nologo

server:
  run: http-mock-server --port ${PORT}

scenarios:
  client:
    # `dotnet <assembly>` rather than the published launcher executable, whose
    # name is `.exe` on Windows and extensionless elsewhere.
    run: dotnet ../../../build/scenario-runtime/OpenTelemetryHttpClient/OpenTelemetryHttpClient.dll
    expected_violations:
      # `System.Net.Http` measures how long a request waited for a connection
      # from the pool, which the registry has no metric for. The instrumentation
      # publishes the runtime's meter whole rather than choosing from it, so
      # this arrives with the rest of the client metrics.
      #
      # `context: {}` matches the finding weaver reports, which carries none —
      # it therefore accepts any metric outside the registry, not this one by
      # name. Weaver gives `missing_metric` nothing narrower to match on.
      - id: missing_metric
        context: {}
        reason: >-
          http.client.request.time_in_queue is a .NET runtime metric that no
          semantic convention describes.
