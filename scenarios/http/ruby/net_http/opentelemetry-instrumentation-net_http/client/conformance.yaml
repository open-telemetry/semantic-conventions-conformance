runner: http-conformance
instrumented_library: net/http
instrumentation_library: opentelemetry-instrumentation-net_http
otlp_protocol: http/protobuf

setup: otel-conformance-ruby install

server:
  run: http-mock-server --port ${PORT}

scenarios:
  client:
    run: otel-conformance-ruby run client.rb
    expected_violations:
      - id: error_type_missing_on_error
        reason: The instrumentation does not set error.type on 4xx or 5xx responses.
      - id: recommended_attribute_not_present
        context:
          attribute_key: network.protocol.version
          kind: client
        reason: The instrumentation does not report network.protocol.version.
      - id: required_attribute_not_present
        context:
          attribute_key: url.full
          kind: client
        reason: The instrumentation does not report the required url.full attribute.
