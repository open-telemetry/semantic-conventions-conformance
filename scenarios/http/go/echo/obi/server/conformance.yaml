# OBI cannot discover this server's route templates. The shared OBI
# configuration leaves unknown routes unset, so `http.route` is omitted
# and the server span name is just the HTTP method.

runner: http-conformance
instrumented_library: github.com/labstack/echo/v5
instrumentation_library: go.opentelemetry.io/obi

setup: otel-conformance-obi install -- otel-conformance-go build

scenarios:
  server:
    run: otel-http-drive --serve otel-conformance-obi run build/scenario
