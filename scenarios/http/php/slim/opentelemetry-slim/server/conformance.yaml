runner: http-conformance
instrumented_library: slim
instrumentation_library: open-telemetry/opentelemetry-auto-slim

env:
  OTEL_PHP_AUTOLOAD_ENABLED: "true"
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: none
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc

setup: otel-conformance-php install

scenarios:
  server:
    # The launcher owns the driver's stdin protocol while php -S keeps PHP's
    # real request-scoped lifecycle and flushes telemetry at request shutdown.
    run: otel-http-drive --serve otel-conformance-php serve ../router.php
