# See tools/obi/README.md#configuration for OBI's route settings.

runner: http-conformance
instrumented_library: grizzly
instrumentation_library: go.opentelemetry.io/obi

setup: otel-conformance-obi install -- otel-conformance-java prepare grizzly:obi

scenarios:
  server:
    run: otel-http-drive --serve otel-conformance-obi run --exe '*/java' --args '*GrizzlyServerScenario*' otel-conformance-java run grizzly:obi io.opentelemetry.conformance.http.grizzly.GrizzlyServerScenario
