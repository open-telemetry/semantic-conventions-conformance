# See tools/obi/README.md#configuration for OBI's route settings.

runner: http-conformance
instrumented_library: tomcat
instrumentation_library: go.opentelemetry.io/obi

setup: otel-conformance-obi install -- otel-conformance-java prepare tomcat:obi

scenarios:
  server:
    run: otel-http-drive --serve otel-conformance-obi run --exe '*/java' --args '*TomcatServerScenario*' otel-conformance-java run tomcat:obi io.opentelemetry.conformance.http.tomcat.TomcatServerScenario
