# See tools/obi/README.md#configuration for OBI's route settings.

runner: http-conformance
instrumented_library: akka-http
instrumentation_library: go.opentelemetry.io/obi

setup: otel-conformance-obi install -- otel-conformance-java prepare akka-http:obi

scenarios:
  server:
    run: otel-http-drive --serve otel-conformance-obi run --exe '*/java' --args '*AkkaHttpServerScenario*' otel-conformance-java run akka-http:obi io.opentelemetry.conformance.http.akkahttp.AkkaHttpServerScenario
