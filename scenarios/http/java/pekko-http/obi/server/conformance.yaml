# See tools/obi/README.md#configuration for OBI's route settings.

runner: http-conformance
instrumented_library: pekko-http
instrumentation_library: go.opentelemetry.io/obi

setup: otel-conformance-obi install -- otel-conformance-java prepare pekko-http:obi

scenarios:
  server:
    run: otel-http-drive --serve otel-conformance-obi run --exe '*/java' --args '*PekkoHttpServerScenario*' otel-conformance-java run pekko-http:obi io.opentelemetry.conformance.http.pekkohttp.PekkoHttpServerScenario
