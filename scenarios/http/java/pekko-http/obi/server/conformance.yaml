# OBI does not get the route templates for Pekko HTTP, so it falls back to a
# route derived from the request path (`/users/*`, `/status/*`) and uses it for
# `http.route` and the span name. Semconv says `http.route` must not be
# populated in that case and the span name should be just the method; OBI does
# that with `routes.unmatched: unset`. This baseline records OBI's default,
# `heuristic`.

runner: http-conformance
instrumented_library: pekko-http
instrumentation_library: go.opentelemetry.io/obi

setup: otel-conformance-obi install -- otel-conformance-java prepare pekko-http:obi

scenarios:
  server:
    run: otel-http-drive --serve otel-conformance-obi run --exe '*/java' --args '*PekkoHttpObiServerScenario*' otel-conformance-java run pekko-http:obi PekkoHttpObiServerScenario
