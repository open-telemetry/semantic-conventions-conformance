runner: http-conformance
instrumented_library: async-http-client
instrumentation_library: io.opentelemetry.javaagent:opentelemetry-javaagent
scenario_contract: ../../../../../../tools/http/test-client/contract.yaml
scenario_contract_variant: client

env:
  # Keep Java runtime metrics out of this HTTP-only conformance report.
  OTEL_INSTRUMENTATION_RUNTIME_TELEMETRY_ENABLED: "false"

weaver:
  config: ../../../../../../tools/java/weaver.toml

setup: otel-conformance-java prepare async-http-client:opentelemetry-javaagent

server:
  run: http-mock-server --port ${PORT}

scenario_run: otel-conformance-java run --agent async-http-client:opentelemetry-javaagent AsyncHttpClientJavaagentClientScenario
