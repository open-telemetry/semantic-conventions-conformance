runner: http-conformance
instrumented_library: ktor
instrumentation_library: io.opentelemetry.instrumentation:opentelemetry-ktor-2.0

weaver:
  config: ../../../weaver.toml

setup: otel-conformance-java prepare ktor:opentelemetry-library-2.0

server:
  run: http-mock-server --port ${PORT}

scenarios:
  client:
    run: otel-conformance-java run ktor:opentelemetry-library-2.0 Ktor2LibraryClientScenario
