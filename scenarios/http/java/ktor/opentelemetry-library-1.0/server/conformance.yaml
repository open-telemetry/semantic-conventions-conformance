runner: http-conformance
instrumented_library: ktor
instrumentation_library: io.opentelemetry.instrumentation:opentelemetry-ktor-1.0

weaver:
  config: ../../../weaver.toml

setup: otel-conformance-java prepare ktor:opentelemetry-library-1.0

scenarios:
  server:
    # The driver owns the client process and closes standard input after the run.
    run: otel-http-drive --serve otel-conformance-java run ktor:opentelemetry-library-1.0 Ktor1LibraryServerScenario
