runner: http-conformance
instrumented_library: ktor
instrumentation_library: io.opentelemetry.instrumentation:opentelemetry-ktor-3.0

weaver:
  config: ../../../../../../tools/java/weaver.toml

setup: otel-conformance-java prepare ktor:opentelemetry-library

server:
  run: http-mock-server --port ${PORT}

scenarios:
  client:
    run: otel-conformance-java run ktor:opentelemetry-library KtorLibraryClientScenario
