# See tools/obi/README.md#configuration for OBI's route settings.

runner: http-conformance
instrumented_library: ktor
instrumentation_library: go.opentelemetry.io/obi

setup: otel-conformance-obi install -- otel-conformance-java prepare ktor:obi

scenarios:
  server:
    run: otel-http-drive --serve otel-conformance-obi run --exe '*/java' --args '*KtorServerScenario*' otel-conformance-java run ktor:obi io.opentelemetry.conformance.http.ktor.KtorServerScenario
