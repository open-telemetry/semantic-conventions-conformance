runner: http-conformance
instrumented_library: ktor
instrumentation_library: go.opentelemetry.io/obi
scenario_contract: ../../../../../../tools/http/test-client/contract.yaml

setup: otel-conformance-obi install -- otel-conformance-java prepare ktor:obi

server:
  run: http-mock-server --port ${PORT}

scenario_run: otel-conformance-obi run --exe '*/java' --args '*KtorClientScenario*' otel-conformance-java run ktor:obi io.opentelemetry.conformance.http.ktor.KtorClientScenario
