runner: http-conformance
instrumented_library: java-http-client
instrumentation_library: io.opentelemetry.instrumentation:opentelemetry-java-http-client

weaver:
  config: ../../../../../../tools/java/weaver.toml

setup: otel-conformance-java prepare java-http-client:opentelemetry-library

server:
  run: http-mock-server --port ${PORT}

scenarios:
  client:
    run: otel-conformance-java run java-http-client:opentelemetry-library JavaHttpClientLibraryClientScenario
