runner: http-conformance
instrumented_library: java-http-client
instrumentation_library: io.opentelemetry.javaagent:opentelemetry-javaagent
scenario_contract: ../../../../../../tools/http/test-client/client-telemetry.yaml

env:
  # Keep Java runtime metrics out of this HTTP-only conformance report.
  OTEL_INSTRUMENTATION_RUNTIME_TELEMETRY_ENABLED: "false"

weaver:
  config: ../../../weaver.toml

setup: otel-conformance-java prepare java-http-client:opentelemetry-javaagent

server:
  run: http-mock-server --port ${PORT}

scenarios:
  client:
    run: otel-conformance-java run --agent java-http-client:opentelemetry-javaagent JavaHttpClientJavaagentClientScenario
