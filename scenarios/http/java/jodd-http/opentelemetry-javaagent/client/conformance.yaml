runner: http-conformance
instrumented_library: jodd-http
instrumentation_library: io.opentelemetry.javaagent:opentelemetry-javaagent

env:
  # Keep Java runtime metrics out of this HTTP-only conformance report.
  OTEL_INSTRUMENTATION_RUNTIME_TELEMETRY_ENABLED: "false"

weaver:
  config: ../../../weaver.toml

setup: otel-conformance-java prepare jodd-http:opentelemetry-javaagent

server:
  run: http-mock-server --port ${PORT}

scenarios:
  client:
    run: otel-conformance-java run --agent jodd-http:opentelemetry-javaagent JoddHttpJavaagentClientScenario
    spans:
      - match:
          scope: io.opentelemetry.jodd-http-4.2
        expect:
          count: 5
