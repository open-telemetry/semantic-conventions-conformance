runner: http-conformance
instrumented_library: jodd-http
instrumentation_library: go.opentelemetry.io/obi
scenario_contract: ../../../../../../tools/http/test-client/contract.yaml

setup: otel-conformance-obi install -- otel-conformance-java prepare jodd-http:obi

server:
  run: http-mock-server --port ${PORT}

scenario_run: otel-conformance-obi run --exe '*/java' --args '*JoddHttpClientScenario*' otel-conformance-java run jodd-http:obi io.opentelemetry.conformance.http.joddhttp.JoddHttpClientScenario
