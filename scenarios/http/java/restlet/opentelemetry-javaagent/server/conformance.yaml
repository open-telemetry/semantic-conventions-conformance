runner: http-conformance
instrumented_library: restlet
instrumentation_library: io.opentelemetry.javaagent:opentelemetry-javaagent

env:
  # Keep Java runtime metrics out of this HTTP-only conformance report.
  OTEL_INSTRUMENTATION_RUNTIME_TELEMETRY_ENABLED: "false"
  # Restlet can run over connectors other than its built-in JDK HTTP server.
  OTEL_INSTRUMENTATION_JAVA_HTTP_SERVER_ENABLED: "false"

weaver:
  config: ../../../../../../tools/java/weaver.toml

setup: otel-conformance-java prepare restlet:opentelemetry-javaagent

scenario_contract: ../../../../../../tools/http/test-client/contract.yaml
scenario_contract_variant: server
scenario_run: otel-http-drive --persistent --serve otel-conformance-java run --agent restlet:opentelemetry-javaagent RestletJavaagentServerScenario
