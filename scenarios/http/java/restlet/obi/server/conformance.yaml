# See tools/obi/README.md#configuration for OBI's route settings.

runner: http-conformance
instrumented_library: restlet
instrumentation_library: go.opentelemetry.io/obi

setup: otel-conformance-obi install -- otel-conformance-java prepare restlet:obi

scenarios:
  server:
    run: otel-http-drive --serve otel-conformance-obi run --exe '*/java' --args '*RestletServerScenario*' otel-conformance-java run restlet:obi io.opentelemetry.conformance.http.restlet.RestletServerScenario
