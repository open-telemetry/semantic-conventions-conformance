runner: http-conformance
instrumented_library: apache-httpasyncclient
instrumentation_library: go.opentelemetry.io/obi
scenario_contract: ../../../../../../tools/http/test-client/contract.yaml

setup: otel-conformance-obi install -- otel-conformance-java prepare apache-httpasyncclient:obi

server:
  run: http-mock-server --port ${PORT}

scenario_run: otel-conformance-obi run --exe '*/java' --args '*ApacheHttpAsyncClientClientScenario*' otel-conformance-java run apache-httpasyncclient:obi io.opentelemetry.conformance.http.apachehttpasyncclient.ApacheHttpAsyncClientClientScenario
