runner: http-conformance
instrumented_library: jetty-httpclient
instrumentation_library: io.opentelemetry.instrumentation:opentelemetry-jetty-httpclient-12.0

weaver:
  config: ../../../weaver.toml

setup: otel-conformance-java prepare jetty-httpclient:opentelemetry-library-12.0

server:
  run: http-mock-server --port ${PORT}

scenarios:
  client:
    run: otel-conformance-java run jetty-httpclient:opentelemetry-library-12.0 JettyHttpClient12LibraryClientScenario
