runner: http-conformance
instrumented_library: jetty-httpclient
instrumentation_library: io.opentelemetry.javaagent:opentelemetry-javaagent

env:
  # Keep Java runtime metrics out of this HTTP-only conformance report.
  OTEL_INSTRUMENTATION_RUNTIME_TELEMETRY_ENABLED: "false"

weaver:
  config: ../../../weaver.toml

setup: otel-conformance-java prepare jetty-httpclient:opentelemetry-javaagent

server:
  run: http-mock-server --port ${PORT}

scenarios:
  client:
    run: otel-conformance-java run --agent jetty-httpclient:opentelemetry-javaagent JettyHttpClientJavaagentClientScenario
    spans:
      - match:
          scope: io.opentelemetry.jetty-httpclient-12.0
        expect:
          count: 5
