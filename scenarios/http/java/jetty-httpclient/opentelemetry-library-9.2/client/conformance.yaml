runner: http-conformance
instrumented_library: jetty-httpclient
instrumentation_library: io.opentelemetry.instrumentation:opentelemetry-jetty-httpclient-9.2

weaver:
  config: ../../../weaver.toml

setup: otel-conformance-java prepare jetty-httpclient:opentelemetry-library-9.2

server:
  run: http-mock-server --port ${PORT}

scenarios:
  client:
    run: otel-conformance-java run jetty-httpclient:opentelemetry-library-9.2 JettyHttpClient9LibraryClientScenario
