runner: http-conformance
instrumented_library: spring-web
instrumentation_library: go.opentelemetry.io/obi
scenario_contract: ../../../../../../tools/http/test-client/contract.yaml

setup: otel-conformance-obi install -- otel-conformance-java prepare spring-web:obi

server:
  run: http-mock-server --port ${PORT}

scenario_run: otel-conformance-obi run --exe '*/java' --args '*SpringWebClientScenario*' otel-conformance-java run spring-web:obi io.opentelemetry.conformance.http.springweb.SpringWebClientScenario
