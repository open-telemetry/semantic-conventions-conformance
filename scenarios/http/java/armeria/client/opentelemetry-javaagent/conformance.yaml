runner: http-conformance
instrumented_library: armeria
instrumentation_library: io.opentelemetry.javaagent:opentelemetry-javaagent:2.30.0

env:
  OTEL_INSTRUMENTATION_RUNTIME_TELEMETRY_ENABLED: "false"

expected_violations:
  - id: missing_attribute
    context:
      attribute_key: processorType
    reason: >-
      OpenTelemetry SDK 1.64 emits its BatchSpanProcessor queueSize
      self-telemetry with a pre-semconv processorType attribute.
  - id: missing_metric
    context: {}
    reason: >-
      OpenTelemetry SDK 1.64 emits the pre-semconv queueSize self-telemetry
      metric while exporting this scenario.

setup:
  - java
  - -Dorg.gradle.appname=gradlew
  - -classpath
  - ../../../gradle/wrapper/gradle-wrapper.jar
  - org.gradle.wrapper.GradleWrapperMain
  - --no-daemon
  - --project-dir
  - ../../..
  - prepareRuntime

server:
  run: http-mock-server --port ${PORT}

scenarios:
  requests:
    run:
      - java
      - -javaagent:../../../runtime/agent/opentelemetry-javaagent.jar
      - -classpath
      - ../../../runtime/lib/*
      - io.opentelemetry.conformance.http.armeria.ArmeriaClientScenario
      - agent
