# See tools/obi/README.md#configuration for OBI's route settings.

runner: http-conformance
instrumented_library: armeria
instrumentation_library: go.opentelemetry.io/obi

setup: otel-conformance-obi install -- otel-conformance-java prepare armeria:obi

scenarios:
  server:
    run: otel-http-drive --serve otel-conformance-obi run --exe '*/java' --args '*ArmeriaServerScenario*' otel-conformance-java run armeria:obi io.opentelemetry.conformance.http.armeria.ArmeriaServerScenario
