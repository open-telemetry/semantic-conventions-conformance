runner: http-conformance
instrumented_library: armeria
instrumentation_library: io.opentelemetry.instrumentation:opentelemetry-armeria-1.3

weaver:
  config: ../../../weaver.toml

# Every Java scenario is built and started the same way, so
# `otel-conformance-java` holds the toolchain and this file names only what is
# this scenario's own.
setup:
  - otel-conformance-java
  - prepare
  - armeria:opentelemetry-library

server:
  run: http-mock-server --port ${PORT}

scenarios:
  client:
    run:
      - otel-conformance-java
      - run
      - armeria:opentelemetry-library
      - io.opentelemetry.conformance.http.armeria.library.ArmeriaLibraryClientScenario
