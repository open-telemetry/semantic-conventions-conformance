runner: http-conformance
instrumented_library: armeria
instrumentation_library: io.opentelemetry.instrumentation:opentelemetry-armeria-1.3

weaver:
  config: ../../../weaver.toml

setup: otel-conformance-java prepare armeria:opentelemetry-library

server:
  run: http-mock-server --port ${PORT}

scenarios:
  client:
    run: otel-conformance-java run armeria:opentelemetry-library ArmeriaLibraryClientScenario
    spans:
      - match:
          scope: io.opentelemetry.armeria-1.3
        expect:
          count: 5
