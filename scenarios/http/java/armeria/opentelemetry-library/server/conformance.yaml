runner: http-conformance
instrumented_library: armeria
instrumentation_library: io.opentelemetry.instrumentation:opentelemetry-armeria-1.3

weaver:
  config: ../../../weaver.toml

# Every Java scenario is built and started the same way, so
# `otel-conformance-java` holds the toolchain and this file names only what is
# this scenario's own.
setup:
  - otel-conformance-java
  - prepare
  - armeria:opentelemetry-library

scenarios:
  server:
    # The requests are sent from outside the scenario, so a server run holds
    # server telemetry only; the driver starts this command, chooses the port
    # it binds, and closes its standard input when it is done.
    run:
      - otel-http-drive
      - --serve
      - otel-conformance-java
      - run
      - armeria:opentelemetry-library
      - io.opentelemetry.conformance.http.armeria.library.ArmeriaLibraryServerScenario
