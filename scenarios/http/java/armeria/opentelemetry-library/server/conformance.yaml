runner: http-conformance
instrumented_library: armeria
instrumentation_library: io.opentelemetry.instrumentation:opentelemetry-armeria-1.3

weaver:
  config: ../../../weaver.toml

setup: otel-conformance-java prepare armeria:opentelemetry-library

scenarios:
  server:
    # The requests are sent from outside the scenario, so a server run holds
    # server telemetry only; the driver starts this command, chooses the port
    # it binds, and closes its standard input when it is done.
    run: otel-http-drive --serve otel-conformance-java run armeria:opentelemetry-library ArmeriaLibraryServerScenario
    spans:
      - match:
          scope: io.opentelemetry.armeria-1.3
        expect:
          count: 6
