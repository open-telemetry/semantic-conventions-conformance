runner: http-conformance
instrumented_library: okhttp
instrumentation_library: io.opentelemetry.instrumentation:opentelemetry-okhttp-3.0

weaver:
  config: ../../../../../../tools/java/weaver.toml

setup: otel-conformance-java prepare okhttp:opentelemetry-library

server:
  run: http-mock-server --port ${PORT}

scenarios:
  client:
    run: otel-conformance-java run okhttp:opentelemetry-library OkHttpLibraryClientScenario
