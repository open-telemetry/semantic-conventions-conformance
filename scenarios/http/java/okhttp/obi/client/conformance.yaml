runner: http-conformance
instrumented_library: okhttp
instrumentation_library: go.opentelemetry.io/obi
scenario_contract: ../../../../../../tools/http/test-client/contract.yaml

setup: otel-conformance-obi install -- otel-conformance-java prepare okhttp:obi

server:
  run: http-mock-server --port ${PORT}

scenario_run: otel-conformance-obi run --exe '*/java' --args '*OkHttpClientScenario*' otel-conformance-java run okhttp:obi io.opentelemetry.conformance.http.okhttp.OkHttpClientScenario
