runner: http-conformance
instrumented_library: spring-webflux
instrumentation_library: io.opentelemetry.instrumentation:opentelemetry-spring-webflux-5.3

weaver:
  config: ../../../weaver.toml

setup: otel-conformance-java prepare spring-webflux:opentelemetry-library

server:
  run: http-mock-server --port ${PORT}

scenarios:
  client:
    run: otel-conformance-java run spring-webflux:opentelemetry-library SpringWebfluxLibraryClientScenario
