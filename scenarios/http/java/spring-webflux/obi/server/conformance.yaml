runner: http-conformance
instrumented_library: spring-webflux
instrumentation_library: go.opentelemetry.io/obi

setup: otel-conformance-obi install -- otel-conformance-java prepare spring-webflux:obi

scenarios:
  server:
    run: otel-http-drive --serve otel-conformance-obi run --exe '*/java' --args '*SpringWebfluxServerScenario*' otel-conformance-java run spring-webflux:obi io.opentelemetry.conformance.http.springwebflux.SpringWebfluxServerScenario
