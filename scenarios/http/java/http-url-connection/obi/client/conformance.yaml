runner: http-conformance
instrumented_library: http-url-connection
instrumentation_library: go.opentelemetry.io/obi
scenario_contract: ../../../../../../tools/http/test-client/contract.yaml

setup: otel-conformance-obi install -- otel-conformance-java prepare http-url-connection:obi

server:
  run: http-mock-server --port ${PORT}

scenario_run: otel-conformance-obi run --exe '*/java' --args '*HttpUrlConnectionClientScenario*' otel-conformance-java run http-url-connection:obi io.opentelemetry.conformance.http.httpurlconnection.HttpUrlConnectionClientScenario
