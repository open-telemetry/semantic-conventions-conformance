# See tools/obi/README.md#configuration for OBI's route settings.

runner: http-conformance
instrumented_library: ratpack
instrumentation_library: go.opentelemetry.io/obi

setup: otel-conformance-obi install -- otel-conformance-java prepare ratpack:obi

scenarios:
  server:
    run: otel-http-drive --serve otel-conformance-obi run --exe '*/java' --args '*RatpackServerScenario*' otel-conformance-java run ratpack:obi io.opentelemetry.conformance.http.ratpack.RatpackServerScenario
