runner: http-conformance
instrumented_library: netty
instrumentation_library: go.opentelemetry.io/obi
scenario_contract: ../../../../../../tools/http/test-client/contract.yaml

setup: otel-conformance-obi install -- otel-conformance-java prepare netty:obi

server:
  run: http-mock-server --port ${PORT}

scenario_run: otel-conformance-obi run --exe '*/java' --args '*NettyClientScenario*' otel-conformance-java run netty:obi io.opentelemetry.conformance.http.netty.NettyClientScenario
