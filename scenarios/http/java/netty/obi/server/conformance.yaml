# See tools/obi/README.md#configuration for OBI's route settings.

runner: http-conformance
instrumented_library: netty
instrumentation_library: go.opentelemetry.io/obi

setup: otel-conformance-obi install -- otel-conformance-java prepare netty:obi

scenarios:
  server:
    run: otel-http-drive --serve otel-conformance-obi run --exe '*/java' --args '*NettyServerScenario*' otel-conformance-java run netty:obi io.opentelemetry.conformance.http.netty.NettyServerScenario
