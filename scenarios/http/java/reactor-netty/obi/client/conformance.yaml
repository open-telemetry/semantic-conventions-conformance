runner: http-conformance
instrumented_library: reactor-netty
instrumentation_library: go.opentelemetry.io/obi
scenario_contract: ../../../../../../tools/http/test-client/contract.yaml

setup: otel-conformance-obi install -- otel-conformance-java prepare reactor-netty:obi

server:
  run: http-mock-server --port ${PORT}

scenario_run: otel-conformance-obi run --exe '*/java' --args '*ReactorNettyClientScenario*' otel-conformance-java run reactor-netty:obi io.opentelemetry.conformance.http.reactornetty.ReactorNettyClientScenario
