runner: http-conformance
instrumented_library: helidon
instrumentation_library: io.opentelemetry.javaagent:opentelemetry-javaagent

env:
  # Keep Java runtime metrics out of this HTTP-only conformance report.
  OTEL_INSTRUMENTATION_RUNTIME_TELEMETRY_ENABLED: "false"

weaver:
  config: ../../../../../../tools/java/weaver.toml

setup: otel-conformance-java prepare helidon:opentelemetry-javaagent

scenario_contract: ../../../../../../tools/http/contracts/server.yaml
scenario_run: otel-http-drive --serve otel-conformance-java run --agent helidon:opentelemetry-javaagent HelidonJavaagentServerScenario
