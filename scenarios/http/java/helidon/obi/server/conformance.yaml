# See tools/obi/README.md#configuration for OBI's route settings.

runner: http-conformance
instrumented_library: helidon
instrumentation_library: go.opentelemetry.io/obi

setup: otel-conformance-obi install -- otel-conformance-java prepare helidon:obi

scenarios:
  server:
    run: otel-http-drive --serve otel-conformance-obi run --exe '*/java' --args '*HelidonServerScenario*' otel-conformance-java run helidon:obi io.opentelemetry.conformance.http.helidon.HelidonServerScenario
