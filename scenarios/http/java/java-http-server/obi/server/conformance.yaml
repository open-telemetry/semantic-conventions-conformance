# OBI does not get the route templates for the JDK HTTP server, so it falls back
# to a route derived from the request path (`/users/*`, `/status/*`) and uses it
# for `http.route` and the span name. Semconv says `http.route` must not be
# populated in that case and the span name should be just the method; OBI does
# that with `routes.unmatched: unset`. This baseline records OBI's default,
# `heuristic`.

runner: http-conformance
instrumented_library: java-http-server
instrumentation_library: go.opentelemetry.io/obi

setup: otel-conformance-obi install -- otel-conformance-java prepare java-http-server:obi

scenarios:
  server:
    run: otel-http-drive --serve otel-conformance-obi run --exe '*/java' --args '*JavaHttpServerObiServerScenario*' otel-conformance-java run java-http-server:obi JavaHttpServerObiServerScenario
