# OBI cannot discover this server's route templates. The shared OBI
# configuration leaves unknown routes unset, so `http.route` is omitted
# and the server span name is just the HTTP method.

runner: http-conformance
instrumented_library: java-http-server
instrumentation_library: go.opentelemetry.io/obi

setup: otel-conformance-obi install -- otel-conformance-java prepare java-http-server:obi

scenarios:
  server:
    run: otel-http-drive --serve otel-conformance-obi run --exe '*/java' --args '*JavaHttpServerServerScenario*' otel-conformance-java run java-http-server:obi io.opentelemetry.conformance.http.javahttpserver.JavaHttpServerServerScenario
