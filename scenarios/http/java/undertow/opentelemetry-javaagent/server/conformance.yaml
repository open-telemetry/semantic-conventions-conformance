runner: http-conformance
instrumented_library: undertow
instrumentation_library: io.opentelemetry.javaagent:opentelemetry-javaagent

env:
  # Keep Java runtime metrics out of this HTTP-only conformance report.
  OTEL_INSTRUMENTATION_RUNTIME_TELEMETRY_ENABLED: "false"

weaver:
  config: ../../../../../../tools/java/weaver.toml

setup: otel-conformance-java prepare undertow:opentelemetry-javaagent

scenario_contract: ../../../../../../tools/http/test-client/contract.yaml
scenario_contract_variant: server
scenario_run:
  command: otel-http-drive --persistent --serve otel-conformance-java run --agent undertow:opentelemetry-javaagent UndertowJavaagentServerScenario
  protocol: jsonl-v1
