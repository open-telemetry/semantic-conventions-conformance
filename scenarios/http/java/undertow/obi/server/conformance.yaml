# See tools/obi/README.md#configuration for OBI's route settings.

runner: http-conformance
instrumented_library: undertow
instrumentation_library: go.opentelemetry.io/obi

setup: otel-conformance-obi install -- otel-conformance-java prepare undertow:obi

scenarios:
  server:
    run: otel-http-drive --serve otel-conformance-obi run --exe '*/java' --args '*UndertowServerScenario*' otel-conformance-java run undertow:obi io.opentelemetry.conformance.http.undertow.UndertowServerScenario
