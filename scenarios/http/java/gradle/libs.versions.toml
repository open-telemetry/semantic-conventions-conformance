[versions]
# Akka stops at 2.6.x and Akka HTTP at 10.2.x here: every later release is under
# the Business Source License rather than Apache 2.0.
akka = "2.6.21"
akka-http = "10.2.10"
armeria = "1.41.0"
async-http-client = "2.12.4"
grizzly = "2.4.4"
helidon = "4.5.3"
httpasyncclient = "4.1.5"
httpclient5 = "5.6.4"
jackson = "2.22.2"
jetty = "12.0.38"
jodd-http = "6.3.0"
netty = "4.1.137.Final"
okhttp = "4.12.0"
opentelemetry = "1.64.0"
# The agent and the instrumentation BOM are one release, published under two
# coordinates, so these two move together or the library scenarios measure a
# different instrumentation from the agent scenarios.
opentelemetry-instrumentation = "2.30.0"
opentelemetry-instrumentation-alpha = "2.30.0-alpha"
pekko = "1.7.0"
pekko-http = "1.4.0"
ratpack = "1.9.0"
reactor-netty = "1.3.7"
restlet = "2.4.4"
spring-boot = "3.5.16"
tomcat = "10.1.59"
undertow = "2.3.26.Final"
vertx = "4.5.32"

[libraries]
akka-actor = { module = "com.typesafe.akka:akka-actor_2.13", version.ref = "akka" }
akka-http = { module = "com.typesafe.akka:akka-http_2.13", version.ref = "akka-http" }
akka-stream = { module = "com.typesafe.akka:akka-stream_2.13", version.ref = "akka" }
armeria = { module = "com.linecorp.armeria:armeria", version.ref = "armeria" }
async-http-client = { module = "org.asynchttpclient:async-http-client", version.ref = "async-http-client" }
grizzly-http-server = { module = "org.glassfish.grizzly:grizzly-http-server", version.ref = "grizzly" }
helidon-webserver = { module = "io.helidon.webserver:helidon-webserver", version.ref = "helidon" }
httpasyncclient = { module = "org.apache.httpcomponents:httpasyncclient", version.ref = "httpasyncclient" }
httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5", version.ref = "httpclient5" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jetty-client = { module = "org.eclipse.jetty:jetty-client", version.ref = "jetty" }
jodd-http = { module = "org.jodd:jodd-http", version.ref = "jodd-http" }
netty-codec-http = { module = "io.netty:netty-codec-http", version.ref = "netty" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
pekko-actor = { module = "org.apache.pekko:pekko-actor_2.13", version.ref = "pekko" }
pekko-http = { module = "org.apache.pekko:pekko-http_2.13", version.ref = "pekko-http" }
pekko-stream = { module = "org.apache.pekko:pekko-stream_2.13", version.ref = "pekko" }
ratpack-core = { module = "io.ratpack:ratpack-core", version.ref = "ratpack" }
ratpack-test = { module = "io.ratpack:ratpack-test", version.ref = "ratpack" }
reactor-netty-http = { module = "io.projectreactor.netty:reactor-netty-http", version.ref = "reactor-netty" }
# Restlet publishes to its own repository rather than Maven Central; this is the
# republication of the same 2.4.4 artifacts, so every build root here can stay
# on `mavenCentral()` alone.
restlet = { module = "io.github.xsavikx:org.restlet", version.ref = "restlet" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
tomcat-embed-core = { module = "org.apache.tomcat.embed:tomcat-embed-core", version.ref = "tomcat" }
undertow-core = { module = "io.undertow:undertow-core", version.ref = "undertow" }
vertx-core = { module = "io.vertx:vertx-core", version.ref = "vertx" }

opentelemetry-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "opentelemetry" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }
opentelemetry-sdk-extension-autoconfigure = { module = "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure" }

opentelemetry-instrumentation-bom-alpha = { module = "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom-alpha", version.ref = "opentelemetry-instrumentation-alpha" }
opentelemetry-instrumentation-armeria = { module = "io.opentelemetry.instrumentation:opentelemetry-armeria-1.3" }
opentelemetry-javaagent = { module = "io.opentelemetry.javaagent:opentelemetry-javaagent", version.ref = "opentelemetry-instrumentation" }
opentelemetry-javaagent-extension-api = { module = "io.opentelemetry.javaagent:opentelemetry-javaagent-extension-api", version.ref = "opentelemetry-instrumentation-alpha" }
