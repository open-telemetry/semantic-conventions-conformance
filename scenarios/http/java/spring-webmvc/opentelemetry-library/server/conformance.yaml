runner: http-conformance
instrumented_library: spring-webmvc
instrumentation_library: io.opentelemetry.instrumentation:opentelemetry-spring-webmvc-6.0

weaver:
  config: ../../../weaver.toml

setup: otel-conformance-java prepare spring-webmvc:opentelemetry-library

scenarios:
  server:
    # The requests are sent from outside the scenario, so a server run holds
    # server telemetry only; the driver starts this command, chooses the port
    # it binds, and closes its standard input when it is done.
    run: otel-http-drive --serve otel-conformance-java run spring-webmvc:opentelemetry-library SpringWebMvcLibraryServerScenario
