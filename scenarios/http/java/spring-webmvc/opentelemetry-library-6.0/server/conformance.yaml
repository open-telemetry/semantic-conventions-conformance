runner: http-conformance
instrumented_library: spring-webmvc
instrumentation_library: io.opentelemetry.instrumentation:opentelemetry-spring-webmvc-6.0

weaver:
  config: ../../../weaver.toml

setup: otel-conformance-java prepare spring-webmvc:opentelemetry-library-6.0

scenarios:
  server:
    # The driver owns the client process and closes standard input after the run.
    run: otel-http-drive --serve otel-conformance-java run spring-webmvc:opentelemetry-library-6.0 SpringWebMvc6LibraryServerScenario
