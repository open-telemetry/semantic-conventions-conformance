runner: http-conformance
instrumented_library: asgi
instrumentation_library: opentelemetry-instrumentation-asgi

env:
  OTEL_SEMCONV_STABILITY_OPT_IN: http

scenario_contract: ../../../../../../tools/http/test-client/contract.yaml
scenario_contract_variant: server
scenario_run:
  command: otel-http-drive --persistent --serve uv run --frozen --project . otel-conformance-python scenario.py
  protocol: jsonl-v1

# What this instrumentation emits beyond the shared HTTP server contract.
additional_metrics:
  - http.server.active_requests
  - http.server.response.body.size
  # Recorded only for a request that carries a body.
  - name: http.server.request.body.size
    required: false

# The ASGI middleware spans each protocol message it relays, so how many
# there are follows the way the framework streamed a response rather than
# anything the contract asked for.
additional_spans:
  - match:
      kind: INTERNAL
