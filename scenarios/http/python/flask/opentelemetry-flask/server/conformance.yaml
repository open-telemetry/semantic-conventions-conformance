runner: http-conformance
instrumented_library: flask
instrumentation_library: opentelemetry-instrumentation-flask

env:
  # Python's HTTP instrumentations still emit the pre-stable attributes by
  # default at 0.65b0 — `http.method`, `http.status_code`, `net.host.name` —
  # so without this a run measures the old conventions.
  OTEL_SEMCONV_STABILITY_OPT_IN: http

scenarios:
  server:
    # The requests are sent from outside the scenario, so a server run holds
    # server telemetry only; the driver starts this command, chooses the port
    # it binds, and closes its standard input when it is done.
    run: otel-http-drive --serve uv run --frozen --project . otel-conformance-python scenario.py
