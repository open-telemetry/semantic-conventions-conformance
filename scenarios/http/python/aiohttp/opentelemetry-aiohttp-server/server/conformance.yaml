runner: http-conformance
instrumented_library: aiohttp
instrumentation_library: opentelemetry-instrumentation-aiohttp-server

env:
  OTEL_SEMCONV_STABILITY_OPT_IN: http

scenarios:
  server:
    run: otel-http-drive --serve uv run --frozen --project . otel-conformance-python scenario.py
