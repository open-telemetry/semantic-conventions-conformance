[project]
name = "urllib3-opentelemetry-conformance-client"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "urllib3==2.7.0",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
    "opentelemetry-instrumentation-urllib3==0.65b0",
    "opentelemetry-conformance[python]",
    "otel-http-test-client",
]

[tool.uv.sources]
opentelemetry-conformance = { path = "../../../../../../tools/runner", editable = true }
otel-http-test-client = { path = "../../../../../../tools/http/test-client/python", editable = true }

[tool.uv]
package = false
