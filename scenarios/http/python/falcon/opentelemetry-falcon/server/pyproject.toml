[project]
name = "falcon-opentelemetry-conformance-server"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "falcon==4.3.1",
    "opentelemetry-api==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.0",
    "opentelemetry-instrumentation-falcon==0.66b0",
    "otel-conformance-python",
    "otel-http-test-client",
]

[tool.uv.sources]
otel-conformance-python = { path = "../../../../../../tools/python", editable = true }
otel-http-test-client = { path = "../../../../../../tools/http/test-client/python", editable = true }

[tool.uv]
package = false
