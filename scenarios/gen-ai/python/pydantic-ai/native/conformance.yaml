runner: genai-conformance
instrumented_library: pydantic-ai
instrumentation_library: pydantic-ai

server:
  run: genai-mock-server --port ${PORT}

env:
  OPENAI_BASE_URL: ${MOCK_SERVER_URL}/v1
  OPENAI_API_KEY: test_openai_api_key
  # No content-capture variable here: Pydantic AI records message content by
  # default and its switch is a constructor argument, not an environment one.

scenarios:
  invoke_agent:
    run: uv run --frozen --project . otel-conformance-python invoke_agent.py
    metrics:
      - gen_ai.client.token.usage
      - operation.cost

  automatic_tool_calling:
    run: uv run --frozen --project . otel-conformance-python automatic_tool_calling.py
    metrics:
      - gen_ai.client.token.usage
      - operation.cost

  streaming:
    run: uv run --frozen --project . otel-conformance-python streaming.py
    metrics:
      - gen_ai.client.token.usage
      - gen_ai.client.operation.time_to_first_chunk
      - operation.cost
