[project]
name = "crewai-openllmetry-conformance"
version = "0.0.0"
# chromadb, which crewai pulls in, imports pydantic v1, and that shim does
# not work on Python 3.14.
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai==1.15.18",
    # Not the latest: 0.62 needs semantic-conventions 0.63b1, and crewai caps
    # the SDK below the release that carries it.
    "opentelemetry-instrumentation-crewai==0.61.0",
    "opentelemetry-api==1.42.0",
    "opentelemetry-sdk==1.42.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.42.0",
    "opentelemetry-distro==0.63b0",
]

[tool.uv]
package = false
