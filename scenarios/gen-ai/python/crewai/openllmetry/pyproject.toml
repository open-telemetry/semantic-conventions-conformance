[project]
name = "crewai-openllmetry-conformance"
version = "0.0.0"
# chromadb, which crewai pulls in, imports pydantic v1, and that shim does
# not work on Python 3.14.
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai==1.15.34",
    "opentelemetry-instrumentation-crewai==0.62.4",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.2",
    "opentelemetry-distro==0.66b2",
]

[tool.uv]
package = false
