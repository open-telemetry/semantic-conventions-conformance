[project]
name = "crewai-openinference-conformance"
version = "0.0.0"
# chromadb, which crewai pulls in, imports pydantic v1, and that shim does
# not work on Python 3.14.
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai==1.15.18",
    "openinference-instrumentation-crewai==1.1.15",
    "opentelemetry-api==1.42.0",
    "opentelemetry-sdk==1.42.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.42.0",
    "opentelemetry-distro==0.63b0",
]

[tool.uv]
package = false
