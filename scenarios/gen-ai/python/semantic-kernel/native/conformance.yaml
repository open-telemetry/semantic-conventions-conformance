runner: genai-conformance
instrumented_library: semantic-kernel
instrumentation_library: semantic-kernel

server:
  run: genai-mock-server --port ${PORT}

env:
  OPENAI_BASE_URL: ${MOCK_SERVER_URL}/v1
  OPENAI_API_KEY: test_openai_api_key
  # Semantic Kernel emits GenAI telemetry only under these experimental switches.
  SEMANTICKERNEL_EXPERIMENTAL_GENAI_ENABLE_OTEL_DIAGNOSTICS: "true"
  SEMANTICKERNEL_EXPERIMENTAL_GENAI_ENABLE_OTEL_DIAGNOSTICS_SENSITIVE: "true"

scenarios:
  invoke_agent:
    run: uv run --frozen --project . otel-conformance-python ../scenarios/invoke_agent.py

  automatic_tool_calling:
    run: uv run --frozen --project . otel-conformance-python ../scenarios/automatic_tool_calling.py

  streaming:
    run: uv run --frozen --project . otel-conformance-python ../scenarios/streaming.py
