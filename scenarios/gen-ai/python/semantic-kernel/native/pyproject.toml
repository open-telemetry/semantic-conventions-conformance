[project]
name = "semantic-kernel-native-conformance"
version = "0.0.0"
# semantic-kernel 1.47.0 caps pydantic below 2.14, and that pydantic's
# pydantic-core (2.46.5) has no 3.15 wheel.
requires-python = ">=3.12,<3.15"
dependencies = [
    "semantic-kernel==1.47.0",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.2",
    # `otel-conformance-python` installs the SDK providers and loads no
    # instrumentation, which is what leaves the library's own telemetry the
    # only thing measured.
    "otel-conformance-python",
]

[tool.uv.sources]
otel-conformance-python = { path = "../../../../../tools/python", editable = true }

[tool.uv]
package = false
