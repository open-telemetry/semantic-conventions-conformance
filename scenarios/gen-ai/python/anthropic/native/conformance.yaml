runner: genai-conformance
instrumented_library: anthropic
instrumentation_library: anthropic

server:
  run: genai-mock-server --port ${PORT}

env:
  ANTHROPIC_BASE_URL: ${MOCK_SERVER_URL}
  ANTHROPIC_API_KEY: test_anthropic_api_key
  # The SDK traces whenever a tracer provider is registered; this adds prompts
  # and completions to its spans.
  ANTHROPIC_OPEN_TELEMETRY_TRACES_CONTENT_MODE: content

scenarios:
  inference:
    run: uv run --frozen --project . otel-conformance-python ../scenarios/inference.py

  streaming:
    run: uv run --frozen --project . otel-conformance-python ../scenarios/streaming.py

  tool_calling:
    run: uv run --frozen --project . otel-conformance-python ../scenarios/tool_calling.py

  automatic_tool_calling:
    run: uv run --frozen --project . otel-conformance-python ../scenarios/automatic_tool_calling.py

  multimodal:
    run: uv run --frozen --project . otel-conformance-python ../scenarios/multimodal.py
