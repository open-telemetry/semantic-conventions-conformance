[project]
name = "anthropic-langchain-conformance"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    # `instruments` names `langchain`, so zero-code skips the instrumentation
    # when only langchain-anthropic is installed.
    "langchain==1.3.18",
    "langchain-anthropic==1.7.0",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
    "opentelemetry-distro==0.65b0",
    "opentelemetry-util-genai==1.1b0",
    "opentelemetry-instrumentation-genai-langchain==1.1b1",
]

[tool.uv]
package = false
