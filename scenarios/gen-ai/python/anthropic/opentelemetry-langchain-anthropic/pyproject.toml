[project]
name = "anthropic-langchain-conformance"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    # `instruments` names `langchain`, so zero-code skips the instrumentation
    # when only langchain-anthropic is installed.
    "langchain==1.4.2",
    "langchain-anthropic==1.7.4",
    "opentelemetry-api==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.0",
    "opentelemetry-distro==0.66b0",
    "opentelemetry-util-genai==1.2b0",
    "opentelemetry-instrumentation-genai-langchain==1.2b0",
]

[tool.uv]
package = false
