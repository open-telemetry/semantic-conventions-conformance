runner: genai-conformance
instrumented_library: autogen
instrumentation_library: openinference-instrumentation-autogen-agentchat

server:
  run: genai-mock-server --port ${PORT}

env:
  OPENAI_BASE_URL: ${MOCK_SERVER_URL}/v1
  OPENAI_API_KEY: test_openai_api_key
  # OpenInference records its own `llm.*` attributes by default;
  # this is the switch that adds the GenAI conventions beside them.
  OPENINFERENCE_ENABLE_GENAI_SEMCONV: "true"
  # autogen-core emits its own create_agent, invoke_agent and execute_tool
  # spans whenever a tracer provider is set, with no switch to turn them
  # off, so this report carries them beside OpenInference's.

scenarios:
  invoke_agent:
    run: uv run --frozen --project . opentelemetry-instrument python ../scenarios/invoke_agent.py

  automatic_tool_calling:
    run: uv run --frozen --project . opentelemetry-instrument python ../scenarios/automatic_tool_calling.py
