runner: genai-conformance
instrumented_library: llama-index
instrumentation_library: llama-index-observability-otel

server:
  run: genai-mock-server --port ${PORT}

env:
  # LlamaIndex's OpenAI LLM passes `api_base` to the client itself, so it is
  # this variable it reads rather than the openai SDK's own OPENAI_BASE_URL.
  OPENAI_API_BASE: ${MOCK_SERVER_URL}/v1
  OPENAI_API_KEY: test_openai_api_key
  # The integration has no content-capture switch: what it records on a span
  # it records unconditionally.

scenarios:
  workflow:
    run: uv run --frozen --project . python workflow.py

  invoke_agent:
    run: uv run --frozen --project . python invoke_agent.py

  automatic_tool_calling:
    run: uv run --frozen --project . python automatic_tool_calling.py
