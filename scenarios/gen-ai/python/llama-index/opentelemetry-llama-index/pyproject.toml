[project]
name = "llama-index-opentelemetry-conformance"
version = "0.0.0"
# The instrumentor imports llama_index from sitecustomize, where pydantic-core
# 2.50 panics on 3.15 ("The Python interpreter is not initialized").
requires-python = ">=3.12,<3.15"
dependencies = [
    "llama-index-core==0.14.25",
    "llama-index-llms-openai==0.8.3",
    "llama-index-embeddings-openai==0.7.0",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.2",
    "opentelemetry-distro==0.66b2",
    "opentelemetry-util-genai==1.3b0",
    "opentelemetry-instrumentation-genai-llama-index==1.3b0",
]

[tool.uv]
package = false
