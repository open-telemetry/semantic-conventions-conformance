runner: genai-conformance
instrumented_library: llama-index
instrumentation_library: opentelemetry-instrumentation-genai-llama-index

server:
  run: genai-mock-server --port ${PORT}

env:
  # LlamaIndex's OpenAI LLM passes `api_base` to the client itself, so it is
  # this variable it reads rather than the openai SDK's own OPENAI_BASE_URL.
  OPENAI_API_BASE: ${MOCK_SERVER_URL}/v1
  OPENAI_API_KEY: test_openai_api_key
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: SPAN_AND_EVENT

scenarios:
  workflow:
    run: uv run --frozen --project . opentelemetry-instrument python ../scenarios/workflow.py

  invoke_agent:
    run: uv run --frozen --project . opentelemetry-instrument python ../scenarios/invoke_agent.py

  automatic_tool_calling:
    run: uv run --frozen --project . opentelemetry-instrument python ../scenarios/automatic_tool_calling.py

  retrieval:
    run: uv run --frozen --project . opentelemetry-instrument python ../scenarios/retrieval.py
