[project]
name = "llama-index-openinference-conformance"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "llama-index-core==0.14.25",
    "llama-index-llms-openai==0.8.2",
    # The instrumentation declares this among its instruments, and zero-code
    # skips an instrumentation whose dependencies are not met. Nothing here
    # imports it, so its own cap on the LLM binding is overridden below.
    "llama-index-multi-modal-llms-openai==0.6.2",
    "openinference-instrumentation-llama-index==4.5.2",
    "opentelemetry-api==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.0",
    "opentelemetry-distro==0.66b0",
]

[tool.uv]
package = false
override-dependencies = ["llama-index-llms-openai==0.8.1"]
