runner: genai-conformance
instrumented_library: groq
instrumentation_library: opentelemetry-instrumentation-groq

server:
  run: genai-mock-server --port ${PORT}

env:
  # Groq is OpenAI-compatible on the wire and its SDK reaches that surface
  # under `/openai/v1`, which the mock's OpenAI blueprint already answers, so
  # the base URL is the server root.
  GROQ_BASE_URL: ${MOCK_SERVER_URL}
  GROQ_API_KEY: test_groq_api_key
  # OpenLLMetry's own switches. It has no opt-in for the current
  # GenAI conventions: what it emits is its own take on them.
  TRACELOOP_TRACE_CONTENT: "true"
  TRACELOOP_METRICS_ENABLED: "true"

scenarios:
  inference:
    run: uv run --frozen --project . opentelemetry-instrument python ../scenarios/inference.py

  streaming:
    run: uv run --frozen --project . opentelemetry-instrument python ../scenarios/streaming.py

  tool_calling:
    run: uv run --frozen --project . opentelemetry-instrument python ../scenarios/tool_calling.py

  structured_output:
    run: uv run --frozen --project . opentelemetry-instrument python ../scenarios/structured_output.py

  multimodal:
    run: uv run --frozen --project . opentelemetry-instrument python ../scenarios/multimodal.py

  embeddings:
    run: uv run --frozen --project . opentelemetry-instrument python ../scenarios/embeddings.py
