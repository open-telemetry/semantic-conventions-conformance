runner: genai-conformance
instrumented_library: google-adk
instrumentation_library: google-adk

server:
  run: genai-mock-server --port ${PORT}

env:
  # The mock serves Gemini under /v1beta, the SDK's default; a client pinned
  # to v1 would not find these routes.
  GOOGLE_GEMINI_BASE_URL: ${MOCK_SERVER_URL}
  GOOGLE_API_KEY: test_google_api_key
  GOOGLE_GENAI_USE_VERTEXAI: "0"
  # ADK emits the GenAI conventions only under this opt-in, and keeps its own
  # experimental spans behind a second switch.
  OTEL_SEMCONV_STABILITY_OPT_IN: gen_ai_latest_experimental
  ADK_EXPERIMENTAL_TELEMETRY: "true"
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: SPAN_AND_EVENT

scenarios:
  invoke_agent:
    run: uv run --frozen --project . opentelemetry-instrument python ../scenarios/invoke_agent.py

  automatic_tool_calling:
    run: uv run --frozen --project . opentelemetry-instrument python ../scenarios/automatic_tool_calling.py
