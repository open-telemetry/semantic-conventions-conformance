[project]
name = "litellm-native-conformance"
version = "0.0.0"
# litellm needs fastuuid, which has no 3.15 wheel and whose PyO3 cannot build for 3.15.
requires-python = ">=3.12,<3.15"
dependencies = [
    "litellm[mcp]==1.106.6",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.2",
    # `otel-conformance-python` installs the SDK providers and loads no
    # instrumentation, which is what leaves the library's own telemetry the
    # only thing measured.
    "otel-conformance-python",
]

[tool.uv.sources]
otel-conformance-python = { path = "../../../../../tools/python", editable = true }

[tool.uv]
package = false
