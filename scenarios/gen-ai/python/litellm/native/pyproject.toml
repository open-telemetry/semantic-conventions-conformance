[project]
name = "litellm-native-conformance"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "litellm==1.98.0",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
    # `otel-conformance-python` installs the SDK providers and loads no
    # instrumentation, which is what leaves the library's own telemetry the
    # only thing measured.
    "opentelemetry-conformance[python]",
]

[tool.uv.sources]
opentelemetry-conformance = { path = "../../../../../tools/runner", editable = true }

[tool.uv]
package = false
