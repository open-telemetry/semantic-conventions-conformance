runner: genai-conformance
instrumented_library: litellm
instrumentation_library: litellm

server:
  run: genai-mock-server --port ${PORT}

env:
  OPENAI_BASE_URL: ${MOCK_SERVER_URL}/v1
  OPENAI_API_KEY: test_openai_api_key
  # LiteLLM emits the GenAI conventions only under this opt-in; without it the
  # spans carry its own older attribute set.
  OTEL_SEMCONV_STABILITY_OPT_IN: gen_ai_latest_experimental
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: SPAN_AND_EVENT
  LITELLM_OTEL_INTEGRATION_ENABLE_METRICS: "true"
  LITELLM_OTEL_INTEGRATION_ENABLE_EVENTS: "true"
  # The shared programs, imported by the entry programs here the way a Java or
  # Node scenario imports the package holding them.
  PYTHONPATH: ..

scenarios:
  inference:
    run: uv run --frozen --project . otel-conformance-python inference.py

  streaming:
    run: uv run --frozen --project . otel-conformance-python streaming.py

  tool_calling:
    run: uv run --frozen --project . otel-conformance-python tool_calling.py

  structured_output:
    run: uv run --frozen --project . otel-conformance-python structured_output.py

  multimodal:
    run: uv run --frozen --project . otel-conformance-python multimodal.py

  embeddings:
    run: uv run --frozen --project . otel-conformance-python embeddings.py
