[project]
name = "litellm-openllmetry-conformance"
version = "0.0.0"
# litellm needs fastuuid, which has no 3.15 wheel and whose PyO3 cannot build for 3.15.
requires-python = ">=3.12,<3.15"
dependencies = [
    "litellm[mcp]==1.106.6",
    "opentelemetry-instrumentation-litellm==0.62.4",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.2",
    "opentelemetry-distro==0.66b2",
]

[tool.uv]
package = false
