[project]
name = "qwen-agent-opentelemetry-conformance"
version = "0.0.0"
# The instrumentor imports pydantic from sitecustomize, where pydantic-core
# 2.50 panics on 3.15 ("The Python interpreter is not initialized").
requires-python = ">=3.12,<3.15"
dependencies = [
    "qwen-agent==0.0.34",
    # qwen-agent imports these at import time without declaring them.
    "numpy==2.5.4",
    "soundfile==0.14.0",
    "python-dateutil==4.0.0",
    "tqdm==4.70.1",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.2",
    "opentelemetry-distro==0.66b2",
    "opentelemetry-util-genai==1.3b0",
    "opentelemetry-instrumentation-genai-qwen-agent==1.3b0",
]

[tool.uv]
package = false
