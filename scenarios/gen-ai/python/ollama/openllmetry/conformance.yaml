runner: genai-conformance
instrumented_library: ollama
instrumentation_library: opentelemetry-instrumentation-ollama

server:
  run: genai-mock-server --port ${PORT}

env:
  OLLAMA_HOST: ${MOCK_SERVER_URL}
  # OpenLLMetry's own switches. It has no opt-in for the current
  # GenAI conventions: what it emits is its own take on them.
  TRACELOOP_TRACE_CONTENT: "true"
  TRACELOOP_METRICS_ENABLED: "true"

scenarios:
  inference:
    run: uv run --frozen --project . opentelemetry-instrument python ../scenarios/inference.py
    # OpenLLMetry names no operation on this span and carries none of the
    # attributes that identify a type on their own, so nothing places it and
    # the run would read as having emitted no spans at all. `type` says which
    # type it is; with no `expect` beside it this asserts nothing, and every
    # finding on the span is still recorded. Drop it once the span identifies
    # itself.
    spans:
      - match:
          kind: client
          attributes:
            llm.request.type: chat
          type: gen_ai.inference.client

  streaming:
