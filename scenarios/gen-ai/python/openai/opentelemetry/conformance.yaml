# DEMO — illustrates the layout only. This instrumentation is *tested* in
# opentelemetry-python-genai; here it is only measured.
runner: genai-conformance
instrumented_library: openai
instrumentation_library: opentelemetry-instrumentation-genai-openai

server:
  run: genai-mock-server --port ${PORT}

env:
  OPENAI_BASE_URL: ${MOCK_SERVER_URL}/v1
  OPENAI_API_KEY: test_openai_api_key
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: SPAN_ONLY

scenarios:
  inference:
    run: uv run --frozen --project . opentelemetry-instrument python ../scenarios/inference.py

  tool_calling:
    run: uv run --frozen --project . opentelemetry-instrument python ../scenarios/tool_calling.py
