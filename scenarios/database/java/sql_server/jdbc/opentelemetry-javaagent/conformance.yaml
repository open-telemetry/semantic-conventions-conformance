runner: database-conformance
runner_config:
  backend: sql_server
instrumented_library: jdbc
instrumentation_library: io.opentelemetry.javaagent:opentelemetry-javaagent
scenario_contract: ../../../../../../tools/database/sql-test-client/contracts/sql_server.yaml
scenario_run: otel-conformance-java run --agent shared:jdbc:opentelemetry-javaagent JdbcJavaagentScenario

env:
  JDBC_URL: jdbc:sqlserver://${DATABASE_HOST}:${DATABASE_PORT};databaseName=${DATABASE_NAME};encrypt=true;trustServerCertificate=true
  JDBC_USER: ${DATABASE_USER}
  JDBC_PASSWORD: ${DATABASE_PASSWORD}
  OTEL_SEMCONV_STABILITY_OPT_IN: database
  OTEL_INSTRUMENTATION_RUNTIME_TELEMETRY_ENABLED: "false"

weaver:
  config: ../../../../../../tools/java/weaver.toml

setup: otel-conformance-java prepare shared:jdbc:opentelemetry-javaagent
