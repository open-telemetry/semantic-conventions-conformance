runner: database-conformance
instrumented_library: jdbc
instrumentation_library: io.opentelemetry.javaagent:opentelemetry-javaagent

env:
  JDBC_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE}
  JDBC_USER: ${POSTGRES_USER}
  JDBC_PASSWORD: ${POSTGRES_PASSWORD}
  OTEL_SEMCONV_STABILITY_OPT_IN: database
  OTEL_INSTRUMENTATION_RUNTIME_TELEMETRY_ENABLED: "false"

weaver:
  config: ../../weaver.toml

setup: otel-conformance-java prepare jdbc:opentelemetry-javaagent

scenarios:
  statement:
    run: otel-conformance-java run --agent jdbc:opentelemetry-javaagent JdbcJavaagentScenario statement
    spans:
      - match:
          attributes:
            db.system.name: postgresql
        expect:
          count: 1
          attributes:
            db.namespace: conformance|conformance
            db.query.summary: SELECT conformance.items
            db.query.text: SELECT count(*) >= ? FROM conformance.items
            server.address: 127.0.0.1
            server.port: {present: true}
    metrics:
      - db.client.operation.duration
      - queueSize
    events: []

  prepared_statement:
    run: otel-conformance-java run --agent jdbc:opentelemetry-javaagent JdbcJavaagentScenario prepared_statement
    spans:
      - match:
          attributes:
            db.system.name: postgresql
        expect:
          count: 1
          attributes:
            db.namespace: conformance|conformance
            db.query.summary: SELECT conformance.items
            db.query.text: SELECT name FROM conformance.items WHERE id = ?
            server.address: 127.0.0.1
            server.port: {present: true}
    metrics:
      - db.client.operation.duration
      - queueSize
    events: []

  batch:
    run: otel-conformance-java run --agent jdbc:opentelemetry-javaagent JdbcJavaagentScenario batch
    spans:
      - match:
          attributes:
            db.system.name: postgresql
        expect:
          count: 1
          attributes:
            db.namespace: conformance|conformance
            db.operation.batch.size: 2
            db.query.text: {present: true}
            server.address: 127.0.0.1
            server.port: {present: true}
    metrics:
      - db.client.operation.duration
      - queueSize
    events: []

  stored_procedure:
    run: otel-conformance-java run --agent jdbc:opentelemetry-javaagent JdbcJavaagentScenario stored_procedure
    spans:
      - match:
          attributes:
            db.system.name: postgresql
        expect:
          count: 1
          attributes:
            db.namespace: conformance|conformance
            db.query.summary: CALL conformance.noop
            db.query.text: CALL conformance.noop()
            db.stored_procedure.name: conformance.noop
            server.address: 127.0.0.1
            server.port: {present: true}
    metrics:
      - db.client.operation.duration
      - queueSize
    events: []
