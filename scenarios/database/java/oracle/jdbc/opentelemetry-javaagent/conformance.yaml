runner: database-conformance
runner_config:
  backend: oracle
instrumented_library: jdbc
instrumentation_library: io.opentelemetry.javaagent:opentelemetry-javaagent
scenario_contract: ../../../../contracts/oracle.yaml

env:
  JDBC_URL: jdbc:oracle:thin:@//${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
  JDBC_USER: ${DATABASE_USER}
  JDBC_PASSWORD: ${DATABASE_PASSWORD}
  OTEL_SEMCONV_STABILITY_OPT_IN: database
  OTEL_INSTRUMENTATION_RUNTIME_TELEMETRY_ENABLED: "false"

weaver:
  config: ../../../../../../tools/java/weaver.toml

setup: otel-conformance-java prepare shared:jdbc:opentelemetry-javaagent

scenarios:
  statement:
    run: otel-conformance-java run --agent shared:jdbc:opentelemetry-javaagent JdbcJavaagentScenario statement

  prepared_statement:
    run: otel-conformance-java run --agent shared:jdbc:opentelemetry-javaagent JdbcJavaagentScenario prepared_statement

  batch:
    run: otel-conformance-java run --agent shared:jdbc:opentelemetry-javaagent JdbcJavaagentScenario batch

  stored_procedure:
    run: otel-conformance-java run --agent shared:jdbc:opentelemetry-javaagent JdbcJavaagentScenario stored_procedure
