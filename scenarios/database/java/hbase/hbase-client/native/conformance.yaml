runner: database-conformance
runner_config:
  backend: hbase
instrumented_library: hbase-client
instrumentation_library: org.apache.hbase:hbase-client
scenario_contract: ../../../../contracts/hbase.yaml

env:
  HBASE_BOOTSTRAP_SERVERS: ${DATABASE_HOST}:${DATABASE_PORT}
  OTEL_LOGS_EXPORTER: none

weaver:
  config: ../../../../../../tools/java/weaver.toml

setup: otel-conformance-java prepare shared:hbase:hbase-client:native

scenarios:
  get:
    run: otel-conformance-java run shared:hbase:hbase-client:native HbaseNativeScenario get

  put:
    run: otel-conformance-java run shared:hbase:hbase-client:native HbaseNativeScenario put

  scan:
    run: otel-conformance-java run shared:hbase:hbase-client:native HbaseNativeScenario scan

  batch:
    run: otel-conformance-java run shared:hbase:hbase-client:native HbaseNativeScenario batch

  error:
    run: otel-conformance-java run shared:hbase:hbase-client:native HbaseNativeScenario error
