runner: database-conformance
runner_config:
  backend: cassandra
instrumented_library: cassandra-driver-4.3
instrumentation_library: io.opentelemetry.javaagent:opentelemetry-javaagent
scenario_contract: ../../../../contracts/cassandra.yaml

env:
  CASSANDRA_HOST: ${DATABASE_HOST}
  CASSANDRA_PORT: ${DATABASE_PORT}
  CASSANDRA_LOCAL_DATACENTER: ${DATABASE_LOCAL_DATACENTER}
  OTEL_SEMCONV_STABILITY_OPT_IN: database
  OTEL_INSTRUMENTATION_RUNTIME_TELEMETRY_ENABLED: "false"

weaver:
  config: ../../../../../../tools/java/weaver.toml

setup: otel-conformance-java prepare shared:cassandra4:opentelemetry-javaagent

scenarios:
  query:
    run: otel-conformance-java run --agent shared:cassandra4:opentelemetry-javaagent Cassandra4JavaagentScenario query

  prepared:
    run: otel-conformance-java run --agent shared:cassandra4:opentelemetry-javaagent Cassandra4JavaagentScenario prepared

  batch:
    run: otel-conformance-java run --agent shared:cassandra4:opentelemetry-javaagent Cassandra4JavaagentScenario batch

  error:
    run: otel-conformance-java run --agent shared:cassandra4:opentelemetry-javaagent Cassandra4JavaagentScenario error
