runner: database-conformance
runner_config:
  backend: elasticsearch
instrumented_library: elasticsearch-transport
instrumentation_library: io.opentelemetry.javaagent:opentelemetry-javaagent
scenario_contract: ../../../../contracts/elasticsearch-transport.yaml

env:
  OTEL_SEMCONV_STABILITY_OPT_IN: database
  OTEL_INSTRUMENTATION_RUNTIME_TELEMETRY_ENABLED: "false"

weaver:
  config: ../../../../../../tools/java/weaver.toml

setup: otel-conformance-java prepare shared:elasticsearch:transport-javaagent

scenarios:
  search:
    run: otel-conformance-java run --agent shared:elasticsearch:transport-javaagent ElasticsearchTransportScenario
