runner: database-conformance
runner_config:
  backend: redis
instrumented_library: jedis
instrumentation_library: io.opentelemetry.javaagent:opentelemetry-javaagent
scenario_contract: ../../../../contracts/redis-jedis.yaml

env:
  OTEL_SEMCONV_STABILITY_OPT_IN: database
  OTEL_INSTRUMENTATION_RUNTIME_TELEMETRY_ENABLED: "false"

weaver:
  config: ../../../../../../tools/java/weaver.toml

setup: otel-conformance-java prepare shared:redis:jedis:opentelemetry-javaagent

scenarios:
  set_get:
    run: otel-conformance-java run --agent shared:redis:jedis:opentelemetry-javaagent JedisJavaagentScenario set_get
  pipeline:
    run: otel-conformance-java run --agent shared:redis:jedis:opentelemetry-javaagent JedisJavaagentScenario pipeline
  error:
    run: otel-conformance-java run --agent shared:redis:jedis:opentelemetry-javaagent JedisJavaagentScenario error
