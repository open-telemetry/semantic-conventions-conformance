runner: database-conformance
runner_config:
  backend: redis
instrumented_library: rediscala
instrumentation_library: io.opentelemetry.javaagent:opentelemetry-javaagent
scenario_contract: ../../../../contracts/redis-rediscala.yaml

env:
  OTEL_SEMCONV_STABILITY_OPT_IN: database
  OTEL_INSTRUMENTATION_RUNTIME_TELEMETRY_ENABLED: "false"

weaver:
  config: ../../../../../../tools/java/weaver.toml

setup: otel-conformance-java prepare shared:redis:rediscala:opentelemetry-javaagent

scenarios:
  set_get:
    run: otel-conformance-java run --agent shared:redis:rediscala:opentelemetry-javaagent RediscalaJavaagentScenario set_get
  transaction:
    run: otel-conformance-java run --agent shared:redis:rediscala:opentelemetry-javaagent RediscalaJavaagentScenario transaction
  error:
    run: otel-conformance-java run --agent shared:redis:rediscala:opentelemetry-javaagent RediscalaJavaagentScenario error
