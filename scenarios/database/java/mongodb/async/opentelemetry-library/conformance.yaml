runner: database-conformance
runner_config:
  backend: mongodb
instrumented_library: mongodb-async
instrumentation_library: io.opentelemetry.instrumentation:opentelemetry-mongo-3.1
scenario_contract: ../../../../contracts/mongodb.yaml

env:
  OTEL_LOGS_EXPORTER: none
  OTEL_SEMCONV_STABILITY_OPT_IN: database
  OTEL_INSTRUMENTATION_RUNTIME_TELEMETRY_ENABLED: "false"

weaver:
  config: ../../../../../../tools/java/weaver.toml

setup: otel-conformance-java prepare shared:mongodb:async:opentelemetry-library

scenarios:
  find:
    run: otel-conformance-java run shared:mongodb:async:opentelemetry-library MongoAsyncLibraryScenario find

  update:
    run: otel-conformance-java run shared:mongodb:async:opentelemetry-library MongoAsyncLibraryScenario update

  delete:
    run: otel-conformance-java run shared:mongodb:async:opentelemetry-library MongoAsyncLibraryScenario delete

  aggregate:
    run: otel-conformance-java run shared:mongodb:async:opentelemetry-library MongoAsyncLibraryScenario aggregate
