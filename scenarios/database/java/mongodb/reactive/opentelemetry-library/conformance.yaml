runner: database-conformance
runner_config:
  backend: mongodb
instrumented_library: mongodb-reactive
instrumentation_library: io.opentelemetry.instrumentation:opentelemetry-mongo-3.1
scenario_contract: ../../../../contracts/mongodb.yaml

env:
  OTEL_SEMCONV_STABILITY_OPT_IN: database
  OTEL_INSTRUMENTATION_RUNTIME_TELEMETRY_ENABLED: "false"

weaver:
  config: ../../../../../../tools/java/weaver.toml

setup: otel-conformance-java prepare shared:mongodb:reactive:opentelemetry-library

scenarios:
  find:
    run: otel-conformance-java run shared:mongodb:reactive:opentelemetry-library MongoReactiveLibraryScenario find

  update:
    run: otel-conformance-java run shared:mongodb:reactive:opentelemetry-library MongoReactiveLibraryScenario update

  delete:
    run: otel-conformance-java run shared:mongodb:reactive:opentelemetry-library MongoReactiveLibraryScenario delete

  aggregate:
    run: otel-conformance-java run shared:mongodb:reactive:opentelemetry-library MongoReactiveLibraryScenario aggregate

  error:
    run: otel-conformance-java run shared:mongodb:reactive:opentelemetry-library MongoReactiveLibraryScenario error
