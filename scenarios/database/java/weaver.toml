#
# Findings filtered out for the Java scenarios. A declared config replaces the
# runner's weaver-defaults.toml outright, so the shared resource filter is
# repeated below.

[[live-check.finding_filters]]
signal_type = "resource"
exclude_samples = [
  "service.name",
  "service.instance.id",
  "telemetry.sdk.language",
  "telemetry.sdk.name",
  "telemetry.sdk.version",
  "telemetry.auto.version",
]

[[live-check.finding_filters]]
signal_type = "metric"
exclude = ["missing_metric"]
sample_names = [
  "queueSize",
  "processedSpans",
  "processedLogs",
  "otlp.exporter.seen",
  "otlp.exporter.exported",
]

[[live-check.finding_filters]]
signal_type = "metric"
exclude = ["missing_attribute"]
sample_names = [
  "processorType",
  "dropped",
  "type",
  "success",
]
