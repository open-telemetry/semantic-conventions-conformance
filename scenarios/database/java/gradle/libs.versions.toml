[versions]
cassandra-driver = "4.19.4"
elasticsearch-java = "9.5.5"
hbase = "3.0.0"
jackson = "2.22.4"
mariadb = "4.0.0"
jedis = "8.0.2"
lettuce = "7.9.0.RELEASE"
mssql = "13.6.2.jre11"
# The modern MongoDB sync and Reactive Streams drivers are released
# together from the same source tree, so one version covers both.
mongodb-driver = "5.14.0"
mysql = "26.7.0"
opentelemetry = "1.67.0"
# The agent and the instrumentation BOM are one release, published under two
# coordinates, so these two move together or the library scenarios measure a
# different instrumentation from the agent scenarios.
opentelemetry-instrumentation = "2.33.1"
opentelemetry-instrumentation-alpha = "2.33.1-alpha"
oracle = "23.26.3.0.0"
postgresql = "42.7.14"
r2dbc-postgresql = "1.1.2.RELEASE"
r2dbc-spi = "1.0.0.RELEASE"
reactivestreams = "1.0.4"
reactor = "3.8.7"
rediscala = "1.17.0"
redisson = "4.8.0"
scala = "3.10.0"

[libraries]
elasticsearch-java = { module = "co.elastic.clients:elasticsearch-java", version.ref = "elasticsearch-java" }
hbase-client = { module = "org.apache.hbase:hbase-client", version.ref = "hbase" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
cassandra-driver = { module = "org.apache.cassandra:java-driver-core", version.ref = "cassandra-driver" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
jedis = { module = "redis.clients:jedis", version.ref = "jedis" }
lettuce = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
mssql = { module = "com.microsoft.sqlserver:mssql-jdbc", version.ref = "mssql" }
mongodb-driver-reactivestreams = { module = "org.mongodb:mongodb-driver-reactivestreams", version.ref = "mongodb-driver" }
mongodb-driver-sync = { module = "org.mongodb:mongodb-driver-sync", version.ref = "mongodb-driver" }
mysql = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api" }
opentelemetry-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "opentelemetry" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }
opentelemetry-instrumentation-bom-alpha = { module = "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom-alpha", version.ref = "opentelemetry-instrumentation-alpha" }
opentelemetry-instrumentation-cassandra44 = { module = "io.opentelemetry.instrumentation:opentelemetry-cassandra-4.4" }
opentelemetry-instrumentation-jdbc = { module = "io.opentelemetry.instrumentation:opentelemetry-jdbc" }
opentelemetry-instrumentation-lettuce = { module = "io.opentelemetry.instrumentation:opentelemetry-lettuce-5.1" }
opentelemetry-instrumentation-mongo = { module = "io.opentelemetry.instrumentation:opentelemetry-mongo-3.1" }
opentelemetry-instrumentation-r2dbc = { module = "io.opentelemetry.instrumentation:opentelemetry-r2dbc-1.0" }
opentelemetry-javaagent = { module = "io.opentelemetry.javaagent:opentelemetry-javaagent", version.ref = "opentelemetry-instrumentation" }
opentelemetry-sdk-extension-autoconfigure = { module = "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure" }
oracle = { module = "com.oracle.database.jdbc:ojdbc11", version.ref = "oracle" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
r2dbc-postgresql = { module = "org.postgresql:r2dbc-postgresql", version.ref = "r2dbc-postgresql" }
r2dbc-spi = { module = "io.r2dbc:r2dbc-spi", version.ref = "r2dbc-spi" }
reactivestreams = { module = "org.reactivestreams:reactive-streams", version.ref = "reactivestreams" }
reactor-core = { module = "io.projectreactor:reactor-core", version.ref = "reactor" }
rediscala = { module = "io.github.rediscala:rediscala_2.13", version.ref = "rediscala" }
redisson = { module = "org.redisson:redisson", version.ref = "redisson" }
scala-library = { module = "org.scala-lang:scala-library", version.ref = "scala" }
