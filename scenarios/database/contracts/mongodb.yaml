scenarios:
  find:
    spans:
      - match:
          attributes:
            db.system.name: mongodb
            db.operation.name: find
        expect:
          count: 1
          attributes:
            db.namespace: conformance
            db.collection.name: items
            db.operation.name: find
            server.address: 127.0.0.1
            server.port: {present: true}
      - &end-sessions
        match:
          attributes:
            db.system.name: mongodb
            db.operation.name: endSessions
        expect:
          count: 1
          attributes:
            db.namespace: admin
            db.collection.name: {present: false}
            db.operation.name: endSessions
            server.address: 127.0.0.1
            server.port: {present: true}
    metrics:
      - db.client.operation.duration
    events: []

  update:
    spans:
      - match:
          attributes:
            db.system.name: mongodb
            db.operation.name: update
        expect:
          count: 1
          attributes:
            db.namespace: conformance
            db.collection.name: items
            db.operation.name: update
            server.address: 127.0.0.1
            server.port: {present: true}
      - *end-sessions
    metrics:
      - db.client.operation.duration
    events: []

  delete:
    spans:
      - match:
          attributes:
            db.system.name: mongodb
            db.operation.name: delete
        expect:
          count: 1
          attributes:
            db.namespace: conformance
            db.collection.name: items
            db.operation.name: delete
            server.address: 127.0.0.1
            server.port: {present: true}
      - *end-sessions
    metrics:
      - db.client.operation.duration
    events: []

  aggregate:
    spans:
      - match:
          attributes:
            db.system.name: mongodb
            db.operation.name: aggregate
        expect:
          count: 1
          attributes:
            db.namespace: conformance
            db.collection.name: items
            db.operation.name: aggregate
            server.address: 127.0.0.1
            server.port: {present: true}
      - *end-sessions
    metrics:
      - db.client.operation.duration
    events: []
