scenarios:
  statement:
    spans:
      - match:
          attributes:
            db.system.name: postgresql
        expect:
          count: 1
          attributes:
            db.namespace: conformance
            db.query.summary: SELECT conformance.items
            db.query.text: SELECT count(*) >= ? FROM conformance.items
            server.address: 127.0.0.1
            server.port: {present: true}
    metrics:
      - db.client.operation.duration
      - queueSize
    events: []

  bind:
    spans:
      - match:
          attributes:
            db.system.name: postgresql
        expect:
          count: 1
          attributes:
            db.namespace: conformance
            db.query.summary: SELECT conformance.items
            db.query.text: SELECT name FROM conformance.items WHERE id = $1
            server.address: 127.0.0.1
            server.port: {present: true}
    metrics:
      - db.client.operation.duration
      - queueSize
    events: []

  batch:
    spans:
      - match:
          attributes:
            db.system.name: postgresql
        expect:
          count: 1
          attributes:
            db.namespace: conformance
            db.operation.batch.size: 2
            db.query.summary: BATCH INSERT conformance.items
            db.query.text: INSERT INTO conformance.items (id, name) VALUES (?, ?)
            server.address: 127.0.0.1
            server.port: {present: true}
    metrics:
      - db.client.operation.duration
      - queueSize
    events: []

  error:
    spans:
      - match:
          attributes:
            db.system.name: postgresql
        expect:
          count: 1
          attributes:
            db.namespace: conformance
            db.query.summary: SELECT conformance.missing_items
            db.query.text: SELECT * FROM conformance.missing_items
            error.type: 42P01
            server.address: 127.0.0.1
            server.port: {present: true}
    metrics:
      - db.client.operation.duration
      - queueSize
    events: []
