scenarios:
  search:
    spans:
      - match:
          attributes:
            db.system.name: elasticsearch
        expect:
          count: 1
          attributes:
            db.operation.name: SearchAction
            network.peer.address: {present: true}
            network.peer.port: {present: true}
    metrics:
      - db.client.operation.duration
      - queueSize
    events: []
