# Stable database CLIENT spans remain required even when native HBase telemetry
# uses legacy attributes. The fixture's RPC bootstrap endpoint is loopback:16000.

scenarios:
  get:
    spans:
      - match:
          kind: CLIENT
          attributes:
            db.system.name: hbase
            db.operation.name: GET
            db.collection.name: items
        expect:
          count: 1
          attributes:
            db.namespace: conformance
            server.address: 127.0.0.1
            server.port: 16000
      - match:
          kind: CLIENT
          attributes:
            db.system.name: hbase
            db.operation.name: SCAN
            db.collection.name: meta
        expect:
          count: 1
          attributes:
            db.namespace: hbase
            server.address: 127.0.0.1
            server.port: 16000
    metrics:
      - db.client.operation.duration
      - queueSize
    events: []

  put:
    spans:
      - match:
          kind: CLIENT
          attributes:
            db.system.name: hbase
            db.operation.name: PUT
            db.collection.name: items
        expect:
          count: 1
          attributes:
            db.namespace: conformance
            server.address: 127.0.0.1
            server.port: 16000
      - match:
          kind: CLIENT
          attributes:
            db.system.name: hbase
            db.operation.name: SCAN
            db.collection.name: meta
        expect:
          count: 1
          attributes:
            db.namespace: hbase
            server.address: 127.0.0.1
            server.port: 16000
    metrics:
      - db.client.operation.duration
      - queueSize
    events: []

  scan:
    spans:
      - match:
          kind: CLIENT
          attributes:
            db.system.name: hbase
            db.operation.name: SCAN
            db.collection.name: items
        expect:
          count: 1
          attributes:
            db.namespace: conformance
            server.address: 127.0.0.1
            server.port: 16000
      - match:
          kind: CLIENT
          attributes:
            db.system.name: hbase
            db.operation.name: SCAN
            db.collection.name: meta
        expect:
          count: 1
          attributes:
            db.namespace: hbase
            server.address: 127.0.0.1
            server.port: 16000
    metrics:
      - db.client.operation.duration
      - queueSize
    events: []

  batch:
    spans:
      - match:
          kind: CLIENT
          attributes:
            db.system.name: hbase
            db.operation.name: BATCH
            db.collection.name: items
        expect:
          count: 1
          attributes:
            db.namespace: conformance
            db.operation.batch.size: 2
            server.address: 127.0.0.1
            server.port: 16000
      - match:
          kind: CLIENT
          attributes:
            db.system.name: hbase
            db.operation.name: SCAN
            db.collection.name: meta
        expect:
          count: 1
          attributes:
            db.namespace: hbase
            server.address: 127.0.0.1
            server.port: 16000
    metrics:
      - db.client.operation.duration
      - queueSize
    events: []
