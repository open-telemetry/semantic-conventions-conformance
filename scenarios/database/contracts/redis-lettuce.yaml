scenarios:
  set_get:
    spans:
      - match:
          type: db.redis.client
          attributes:
            db.operation.name: HELLO
        expect:
          count: 1
          attributes:
            db.query.text: HELLO 3
            server.address: 127.0.0.1
            server.port: {present: true}
      - match:
          type: db.redis.client
          attributes:
            db.operation.name: CLIENT
        expect:
          count: 3
          attributes:
            db.query.text: {distinct: 3}
            server.address: 127.0.0.1
            server.port: {present: true}
      - match:
          type: db.redis.client
          attributes:
            db.operation.name: SET
        expect:
          count: 1
          attributes:
            db.query.text: "SET conformance:value ?"
            server.address: 127.0.0.1
            server.port: {present: true}
      - match:
          type: db.redis.client
          attributes:
            db.operation.name: GET
        expect:
          count: 1
          attributes:
            db.query.text: GET conformance:value
            server.address: 127.0.0.1
            server.port: {present: true}
    metrics:
      - db.client.operation.duration
    events: []

  pipeline:
    spans:
      - match:
          type: db.redis.client
          attributes:
            db.operation.name: HELLO
        expect:
          count: 1
          attributes:
            db.query.text: HELLO 3
            server.address: 127.0.0.1
            server.port: {present: true}
      - match:
          type: db.redis.client
          attributes:
            db.operation.name: CLIENT
        expect:
          count: 3
          attributes:
            db.query.text: {distinct: 3}
            server.address: 127.0.0.1
            server.port: {present: true}
      - match:
          type: db.redis.client
          attributes:
            db.operation.name: SET
            db.query.text: "SET conformance:pipeline:1 ?"
        expect:
          count: 1
          attributes:
            server.address: 127.0.0.1
            server.port: {present: true}
      - match:
          type: db.redis.client
          attributes:
            db.operation.name: SET
            db.query.text: "SET conformance:pipeline:2 ?"
        expect:
          count: 1
          attributes:
            server.address: 127.0.0.1
            server.port: {present: true}
      - match:
          type: db.redis.client
          attributes:
            db.operation.name: GET
            db.query.text: GET conformance:pipeline:1
        expect:
          count: 1
          attributes:
            server.address: 127.0.0.1
            server.port: {present: true}
      - match:
          type: db.redis.client
          attributes:
            db.operation.name: GET
            db.query.text: GET conformance:pipeline:2
        expect:
          count: 1
          attributes:
            server.address: 127.0.0.1
            server.port: {present: true}
    metrics:
      - db.client.operation.duration
    events: []

  error:
    spans:
      - match:
          type: db.redis.client
          attributes:
            db.operation.name: HELLO
        expect:
          count: 1
          attributes:
            db.query.text: HELLO 3
            server.address: 127.0.0.1
            server.port: {present: true}
      - match:
          type: db.redis.client
          attributes:
            db.operation.name: CLIENT
        expect:
          count: 3
          attributes:
            db.query.text: {distinct: 3}
            server.address: 127.0.0.1
            server.port: {present: true}
      - match:
          type: db.redis.client
          attributes:
            db.operation.name: SET
        expect:
          count: 1
          attributes:
            db.query.text: "SET conformance:error ?"
            server.address: 127.0.0.1
            server.port: {present: true}
      - match:
          type: db.redis.client
          attributes:
            db.operation.name: LPUSH
        expect:
          count: 1
          attributes:
            db.query.text: "LPUSH conformance:error ?"
            error.type: WRONGTYPE
            server.address: 127.0.0.1
            server.port: {present: true}
    metrics:
      - db.client.operation.duration
    events: []
