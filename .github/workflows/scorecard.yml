name: OSSF Scorecard

on:
  push:
    branches:
      - main
  schedule:
    - cron: '48 3 * * 2' # weekly at 03:48 (UTC) on Tuesday
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    permissions:
      contents: read # for actions/checkout
      id-token: write # for Scorecard to publish results
      security-events: write # for the SARIF upload to code scanning
    uses: open-telemetry/shared-workflows/.github/workflows/scorecard.yml@6839dcd6ea227c18b59d11da34499746634728ad # v0.17.0
