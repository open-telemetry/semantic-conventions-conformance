name: OSSF Scorecard

on:
  push:
    branches:
      - main
  schedule:
    - cron: '48 3 * * 2' # weekly at 03:48 (UTC) on Tuesday
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    permissions:
      contents: read # for actions/checkout
      id-token: write # for Scorecard to publish results
      security-events: write # for the SARIF upload to code scanning
    uses: open-telemetry/shared-workflows/.github/workflows/scorecard.yml@93dce0eff8b818861b7ec1e1e8a111fd4c3e17c3 # pending v0.8.0
    with:
      use-cncf-hosted-runner: true
