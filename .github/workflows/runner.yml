name: Runner

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ github.workflow }}-test-${{ matrix.os }}-${{ matrix.python-version }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Test the runner on each supported operating system.
          - os: ubuntu-latest
            python-version: "3.14"
          # A native PowerShell run for the supported Windows path.
          - os: windows-latest
            python-version: "3.14"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # --no-deps skips the OTel stack: these tests never reach the lazy
      # opentelemetry-test-utils import, so only the listed packages are needed.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml flask
          python -m pip install --no-deps -e tools/runner -e tools/gen-ai/mock-server -e tools/gen-ai/runner -e tools/http/runner -e tools/http/mock-server -e tools/http/test-client/python -e tools/java -e tools/js

      - name: Test
        run: python -m pytest tools/runner/tests tools/gen-ai/mock-server/tests tools/http/runner/tests tools/http/test-client/python/tests tools/java/tests tools/js/tests

  lint:
    name: Lint
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-lint-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check .

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Compiles, formats and unit-tests every Java module the HTTP scenarios
      # use, including the ones shared with other domains.
      - name: Build Java
        run: scenarios/http/java/gradlew --project-dir scenarios/http/java build

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"

      # Installs, formats and unit-tests every Node package the HTTP scenarios
      # use, including the ones shared with other domains.
      - name: Build JavaScript
        run: |
          npm --prefix scenarios/http/js ci
          npm --prefix scenarios/http/js run format:check
          npm --prefix scenarios/http/js test

  types:
    name: Types
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-types-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # Real dependencies here, unlike the test job: pyright needs every import
      # to resolve. `semconv_genai` is the exception — it ships with the
      # registry, so it exists only after a run has fetched the pin.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyright pytest pyyaml flask \
            opentelemetry-sdk opentelemetry-exporter-otlp-proto-grpc \
            opentelemetry-test-utils
          python -m pip install --no-deps \
            -e tools/runner \
            -e tools/gen-ai/mock-server \
            -e tools/gen-ai/runner \
            -e tools/http/runner \
            -e tools/http/mock-server \
            -e tools/http/test-client/python \
            -e tools/java \
            -e tools/js

      - name: Run pyright
        run: python -m pyright

  # Separate from `test` because it needs weaver and the fetched registry.
  coverage-model:
    name: Coverage model
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-coverage-model-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install weaver
        run: |
          . tools/runner/src/opentelemetry/conformance/versions.env
          url="https://github.com/open-telemetry/weaver/releases/download"
          curl -fsSL \
            "$url/$WEAVER_VERSION/weaver-x86_64-unknown-linux-gnu.tar.xz" \
            | sudo tar -xJ -C /usr/local/bin --strip-components=1 \
              --wildcards '*/weaver'
          weaver --version

      # Only the pins: a resolved coverage model names the template that
      # produced it, so editing one asks for a fresh model by itself.
      - name: Cache the semconv registries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/otel-conformance/semconv
          key: semconv-${{ hashFiles('tools/**/versions.env') }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install \
            -e tools/runner \
            -e tools/gen-ai/mock-server \
            -e tools/gen-ai/runner \
            -e tools/http/test-client/python \
            -e tools/http/mock-server \
            -e tools/http/runner

      # Separate step: the tests below skip when a model won't resolve, which
      # would leave this job green having checked nothing.
      - name: Resolve the coverage models
        run: |
          python -c 'from genai_conformance import DOMAIN; DOMAIN.coverage_model'
          python -c 'from http_conformance import DOMAIN; DOMAIN.coverage_model'

      - name: Test the coverage models
        run: |
          python -m pytest \
            tools/gen-ai/runner/tests \
            tools/http/runner/tests

  scenarios:
    name: Scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-scenarios-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "scenarios/**/uv.lock"

      # A JVM scenario builds itself from source in its `setup:` before it runs.
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # A Node scenario installs its workspace from the lockfile in its `setup:`.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: "scenarios/**/package-lock.json"

      - name: Install weaver
        run: |
          . tools/runner/src/opentelemetry/conformance/versions.env
          url="https://github.com/open-telemetry/weaver/releases/download"
          curl -fsSL \
            "$url/$WEAVER_VERSION/weaver-x86_64-unknown-linux-gnu.tar.xz" \
            | sudo tar -xJ -C /usr/local/bin --strip-components=1 \
              --wildcards '*/weaver'
          weaver --version

      - name: Install the runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -e tools/runner \
            -e tools/gen-ai/mock-server \
            -e tools/gen-ai/runner \
            -e tools/http/mock-server \
            -e tools/http/runner \
            -e tools/http/test-client/python \
            -e tools/java \
            -e tools/js

      - name: Cache the semconv registries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/otel-conformance/semconv
          key: semconv-${{ hashFiles('tools/**/versions.env') }}

      - name: Run every scenario
        env:
          FORCE_COLOR: "1" # the log renders ANSI; the step's stdout is no tty
        run: |
          set -uo pipefail
          mapfile -t directories < <(
            find scenarios -name .venv -prune -o \
              -name conformance.yaml -exec dirname {} \; | sort
          )
          status=0
          for directory in "${directories[@]}"; do
            echo "::group::$directory"
            otel-conformance "$directory" --report-only || status=1
            echo "::endgroup::"
          done
          exit "$status"

      - name: Check the committed coverage is up to date
        if: ${{ !cancelled() }}
        run: |
          git add --intent-to-add -- scenarios
          if ! git diff --exit-code -- scenarios; then
            echo "::error::the committed data.json files are out of date — run the scenarios and commit the result"
            exit 1
          fi

      - name: Upload the weaver reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weaver-reports
          path: scenarios/**/output/weaver-reports/*.json
          if-no-files-found: warn
