name: Runner

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ github.workflow }}-test-${{ matrix.os }}-${{ matrix.python-version }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Test the runner on each supported operating system.
          - os: ubuntu-latest
            python-version: "3.14"
          # A native PowerShell run for the supported Windows path.
          - os: windows-latest
            python-version: "3.14"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # --no-deps skips the OTel stack: these tests never reach the lazy
      # opentelemetry-test-utils import, so only the listed packages are needed.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml flask testcontainers
          python -m pip install --no-deps -e tools/runner -e tools/database/runner -e tools/gen-ai/mock-server -e tools/gen-ai/runner -e tools/http/runner -e tools/http/mock-server -e tools/http/test-client/python -e tools/python -e tools/java -e tools/js -e tools/dotnet -e tools/rust

      - name: Test
        run: python -m pytest tools/runner/tests tools/database/runner/tests tools/gen-ai/mock-server/tests tools/http/runner/tests tools/http/test-client/python/tests tools/java/tests tools/js/tests tools/dotnet/tests tools/rust/tests

  lint:
    name: Lint
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-lint-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check .

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Compiles, formats and unit-tests every Java scenario build.
      - name: Build Java
        run: |
          scenarios/database/java/gradlew --project-dir scenarios/database/java build
          scenarios/http/java/gradlew --project-dir scenarios/http/java build

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"

      # Installs, formats and unit-tests every Node package the HTTP scenarios
      # use, including the ones shared with other domains.
      - name: Build JavaScript
        run: |
          npm --prefix scenarios/http/js ci
          npm --prefix scenarios/http/js run format:check
          npm --prefix scenarios/http/js test

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: scenarios/http/dotnet/global.json

      # Compiles and unit-tests every .NET project the HTTP scenarios use,
      # including the ones shared with other domains. `dotnet test` alone would
      # compile only the test projects, leaving a broken scenario undetected.
      # Run from the build root, which is where `global.json` pins the SDK: the
      # version a project builds against follows the working directory.
      - name: Build .NET
        working-directory: scenarios/http/dotnet
        run: |
          dotnet build http-dotnet-conformance.slnx
          dotnet test http-dotnet-conformance.slnx --no-build

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.88.0
          components: clippy,rustfmt
          # The Cargo workspace, which is not the repository root the action's
          # cache assumes: without this it saves a `target/` no build writes.
          cache-workspaces: scenarios/http/rust

      # One workspace includes the scenario binaries and the shared Rust crates
      # under tools/, so these commands cover every Rust package used here.
      - name: Build Rust
        working-directory: scenarios/http/rust
        run: |
          cargo fmt --check
          cargo clippy --workspace --locked -- -D warnings
          cargo test --workspace --locked

  types:
    name: Types
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-types-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # Real dependencies here, unlike the test job: pyright needs every import
      # to resolve. `semconv_genai` is the exception — it ships with the
      # registry, so it exists only after a run has fetched the pin.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyright pytest pyyaml flask testcontainers \
            opentelemetry-sdk opentelemetry-exporter-otlp-proto-grpc \
            opentelemetry-test-utils
          python -m pip install --no-deps \
            -e tools/runner \
            -e tools/database/runner \
            -e tools/gen-ai/mock-server \
            -e tools/gen-ai/runner \
            -e tools/http/runner \
            -e tools/http/mock-server \
            -e tools/http/test-client/python \
            -e tools/python \
            -e tools/java \
            -e tools/js \
            -e tools/dotnet \
            -e tools/rust

      - name: Run pyright
        run: python -m pyright

  # Separate from `test` because it needs weaver and the fetched registry.
  coverage-model:
    name: Coverage model
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-coverage-model-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install weaver
        run: |
          . tools/runner/src/opentelemetry/conformance/versions.env
          url="https://github.com/open-telemetry/weaver/releases/download"
          curl -fsSL \
            "$url/$WEAVER_VERSION/weaver-x86_64-unknown-linux-gnu.tar.xz" \
            | sudo tar -xJ -C /usr/local/bin --strip-components=1 \
              --wildcards '*/weaver'
          weaver --version

      # Only the pins: a resolved coverage model names the template that
      # produced it, so editing one asks for a fresh model by itself.
      - name: Cache the semconv registries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/otel-conformance/semconv
          key: semconv-${{ hashFiles('tools/**/versions.env') }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install \
            -e tools/runner \
            -e tools/database/runner \
            -e tools/gen-ai/mock-server \
            -e tools/gen-ai/runner \
            -e tools/http/test-client/python \
            -e tools/http/mock-server \
            -e tools/http/runner

      # Separate step: the tests below skip when a model won't resolve, which
      # would leave this job green having checked nothing.
      - name: Resolve the coverage models
        run: |
          python -c 'from database_conformance import DOMAIN; DOMAIN.coverage_model'
          python -c 'from genai_conformance import DOMAIN; DOMAIN.coverage_model'
          python -c 'from http_conformance import DOMAIN; DOMAIN.coverage_model'

      - name: Test the coverage models
        run: |
          python -m pytest \
            tools/database/runner/tests \
            tools/gen-ai/runner/tests \
            tools/http/runner/tests

  discover-scenarios:
    name: Discover scenarios
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-discover-scenarios-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate matrix
        id: matrix
        shell: bash
        run: |
          scenario_paths="$(git ls-files 'scenarios/**/conformance.yaml')"
          if [[ -z "$scenario_paths" ]]; then
            echo "::error::no conformance scenarios found"
            exit 1
          fi
          matrix="$(
            printf '%s\n' "$scenario_paths" |
              jq -Rsc '
                split("\n") |
                map(
                  select(length > 0) |
                  split("/") |
                  if length < 4 then
                    error("unexpected conformance scenario path: " + join("/"))
                  else
                    {domain: .[1], language: .[2]}
                  end
                ) |
                unique |
                {include: .}
              '
          )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  scenarios:
    needs: discover-scenarios
    name: Scenarios (${{ matrix.domain }}, ${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCENARIO_ROOT: scenarios/${{ matrix.domain }}/${{ matrix.language }}
    concurrency:
      group: ${{ github.workflow }}-scenarios-${{ matrix.domain }}-${{ matrix.language }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-scenarios.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        if: matrix.language == 'python'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # Scope lockfiles to this matrix job so each Python matrix job caches
          # its own package set instead of sharing one.
          cache-dependency-glob: "scenarios/${{ matrix.domain }}/${{ matrix.language }}/**/uv.lock"

      # A JVM scenario builds itself from source in its `setup:` before it runs.
      - name: Set up Java
        if: matrix.language == 'java'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: matrix.language == 'java'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # A Node scenario installs its workspace from the lockfile in its `setup:`.
      - name: Set up Node
        if: matrix.language == 'js'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: "scenarios/**/package-lock.json"

      # A .NET scenario builds itself from source in its `setup:` before it
      # runs, from its own directory, which is inside the build root the
      # `global.json` pins.
      - name: Set up .NET
        if: matrix.language == 'dotnet'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: scenarios/${{ matrix.domain }}/${{ matrix.language }}/global.json

      # A Rust scenario compiles itself in its `setup:` before it runs.
      - name: Set up Rust
        if: matrix.language == 'rust'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.88.0
          # The Cargo workspace, which is not the repository root the action's
          # cache assumes: without this it saves a `target/` no build writes.
          cache-workspaces: ${{ env.SCENARIO_ROOT }}

      - name: Install weaver
        run: |
          . tools/runner/src/opentelemetry/conformance/versions.env
          url="https://github.com/open-telemetry/weaver/releases/download"
          curl -fsSL \
            "$url/$WEAVER_VERSION/weaver-x86_64-unknown-linux-gnu.tar.xz" \
            | sudo tar -xJ -C /usr/local/bin --strip-components=1 \
              --wildcards '*/weaver'
          weaver --version

      - name: Install the runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -e tools/runner \
            -e tools/database/runner \
            -e tools/gen-ai/mock-server \
            -e tools/gen-ai/runner \
            -e tools/http/mock-server \
            -e tools/http/runner \
            -e tools/http/test-client/python \
            -e tools/python \
            -e tools/java \
            -e tools/js \
            -e tools/dotnet \
            -e tools/rust

      # Keyed by domain too: a matrix job fetches only the registry its own
      # domain pins, so one key per domain keeps every cache complete.
      - name: Cache the semconv registries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/otel-conformance/semconv
          key: semconv-${{ matrix.domain }}-${{ hashFiles('tools/**/versions.env') }}

      - name: Run scenarios
        env:
          FORCE_COLOR: "1" # the log renders ANSI; the step's stdout is no tty
        run: |
          set -uo pipefail
          mapfile -t directories < <(
            find "$SCENARIO_ROOT" -name .venv -prune -o \
              -name conformance.yaml -exec dirname {} \; | sort
          )
          status=0
          for directory in "${directories[@]}"; do
            echo "::group::$directory"
            otel-conformance "$directory" --report-only || status=1
            echo "::endgroup::"
          done
          exit "$status"

      - name: Check the committed coverage is up to date
        if: ${{ !cancelled() }}
        run: |
          git add --intent-to-add -- "$SCENARIO_ROOT"
          if ! git diff --exit-code -- "$SCENARIO_ROOT"; then
            echo "::error::the committed data.json files are out of date — run the scenarios and commit the result"
            exit 1
          fi

      - name: Upload the weaver reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weaver-reports-${{ matrix.domain }}-${{ matrix.language }}
          path: scenarios/${{ matrix.domain }}/${{ matrix.language }}/**/output/weaver-reports/*.json
          if-no-files-found: warn

  required-status-check:
    needs:
      - test
      - lint
      - types
      - coverage-model
      - discover-scenarios
      - scenarios
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - if: |
          needs.test.result != 'success' ||
          needs.lint.result != 'success' ||
          needs.types.result != 'success' ||
          needs.coverage-model.result != 'success' ||
          needs.discover-scenarios.result != 'success' ||
          needs.scenarios.result != 'success'
        run: exit 1
