name: Runner

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-test-${{ matrix.python-version }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        # The bounds of requires-python in tools/runner/pyproject.toml.
        python-version: ["3.10", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # --no-deps skips the OTel stack: these tests never reach the lazy
      # opentelemetry-test-utils import, so only the listed packages are needed.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml flask
          python -m pip install --no-deps \
            -e tools/runner \
            -e tools/gen-ai/mock-server \
            -e tools/gen-ai/runner \
            -e tools/http/runner \
            -e tools/http/mock-server \
            -e tools/http/test-client/python

      - name: Test
        run: |
          python -m pytest \
            tools/runner/tests \
            tools/gen-ai/mock-server/tests \
            tools/http/runner/tests

  lint:
    name: Lint
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-lint-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check .

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run Spotless
        run: scenarios/http/java/gradlew --project-dir scenarios/http/java spotlessCheck

  types:
    name: Types
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-types-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Real dependencies here, unlike the test job: pyright needs every import
      # to resolve. `semconv_genai` is the exception — it ships with the
      # registry, so it exists only after a run has fetched the pin.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyright pytest pyyaml flask \
            opentelemetry-sdk opentelemetry-exporter-otlp-proto-grpc \
            opentelemetry-test-utils
          python -m pip install --no-deps \
            -e tools/runner \
            -e tools/gen-ai/mock-server \
            -e tools/gen-ai/runner \
            -e tools/http/runner \
            -e tools/http/mock-server \
            -e tools/http/test-client/python

      - name: Run pyright
        run: python -m pyright

  # Separate from `test` because it needs weaver and the fetched registry.
  coverage-model:
    name: Coverage model
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-coverage-model-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install weaver
        run: |
          . tools/runner/src/opentelemetry/conformance/versions.env
          url="https://github.com/open-telemetry/weaver/releases/download"
          curl -fsSL \
            "$url/$WEAVER_VERSION/weaver-x86_64-unknown-linux-gnu.tar.xz" \
            | sudo tar -xJ -C /usr/local/bin --strip-components=1 \
              --wildcards '*/weaver'
          weaver --version

      # Only the pins: a resolved coverage model names the template that
      # produced it, so editing one asks for a fresh model by itself.
      - name: Cache the semconv registries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/otel-conformance/semconv
          key: semconv-${{ hashFiles('tools/**/versions.env') }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install \
            -e tools/runner \
            -e tools/gen-ai/mock-server \
            -e tools/gen-ai/runner \
            -e tools/http/mock-server \
            -e tools/http/runner

      # Separate step: the tests below skip when a model won't resolve, which
      # would leave this job green having checked nothing.
      - name: Resolve the coverage models
        run: |
          python -c 'from genai_conformance import DOMAIN; DOMAIN.coverage_model'
          python -c 'from http_conformance import DOMAIN; DOMAIN.coverage_model'

      - name: Test the coverage models
        run: |
          python -m pytest \
            tools/gen-ai/runner/tests \
            tools/http/runner/tests

  # The heavy gate: installs every scenario's dependencies, runs the programs,
  # and checks the committed data.json files still match what they emit.
  scenarios:
    name: Scenarios
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-scenarios-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Every scenario runs `uv run --project .` in its own directory, so uv,
      # not pip, installs what the programs need.
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install weaver
        run: |
          . tools/runner/src/opentelemetry/conformance/versions.env
          url="https://github.com/open-telemetry/weaver/releases/download"
          curl -fsSL \
            "$url/$WEAVER_VERSION/weaver-x86_64-unknown-linux-gnu.tar.xz" \
            | sudo tar -xJ -C /usr/local/bin --strip-components=1 \
              --wildcards '*/weaver'
          weaver --version

      - name: Install the runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -e tools/runner \
            -e tools/gen-ai/mock-server \
            -e tools/gen-ai/runner \
            -e tools/http/runner \
            -e tools/http/mock-server \
            -e tools/http/test-client/python

      # The pinned registries and the coverage models resolved from them,
      # once, shared by every scenario directory.
      - name: Cache the semconv registries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/otel-conformance/semconv
          key: >-
            semconv-${{ hashFiles(
              'tools/**/versions.env',
              'tools/runner/src/opentelemetry/conformance/weaver-templates/**',
              'tools/runner/src/opentelemetry/conformance/collect-coverage-model.sh'
            ) }}

      # Plain `otel-conformance`: each directory names the wrapper that
      # supplies its registry and reduction, so one loop covers every domain.
      #
      # --report-only: a semconv finding is a result this repo records, not a
      # build to break. What must not change silently is data.json, which the
      # next step diffs.
      - name: Run every scenario
        env:
          FORCE_COLOR: "1" # the log renders ANSI; the step's stdout is no tty
        run: |
          set -euo pipefail
          mapfile -t directories < <(
            find scenarios -name conformance.yaml -printf '%h\n' | sort
          )
          for directory in "${directories[@]}"; do
            echo "::group::$directory"
            otel-conformance "$directory" --report-only
            echo "::endgroup::"
          done

      # A run rewrites each directory's data.json. Unchanged means the
      # committed coverage still matches what the implementations emit;
      # changed means either an implementation moved or a registry pin did,
      # and the new file belongs in the PR.
      - name: Check the committed coverage is up to date
        run: |
          # --intent-to-add first: a new scenario directory whose data.json
          # was never `git add`ed is untracked, and `git diff` can't see it.
          git add --intent-to-add -- scenarios
          if ! git diff --exit-code -- scenarios; then
            echo "::error::the committed data.json files are out of date — run the scenarios and commit the result"
            exit 1
          fi

      - name: Upload the weaver reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weaver-reports
          path: scenarios/**/output/weaver-reports/*.json
          if-no-files-found: warn
