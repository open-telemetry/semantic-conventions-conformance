name: Report

# Rebuild the site's aggregate report nightly and open a PR when it changes.
on:
  schedule:
    # Off the hour: GitHub's scheduler queues runs scheduled at :00.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Serialize updates to the shared report branch.
concurrency:
  group: report
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      REPORT_BRANCH: chore/conformance-report
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install weaver
        run: |
          . tools/runner/src/opentelemetry/conformance/versions.env
          url="https://github.com/open-telemetry/weaver/releases/download"
          curl -fsSL \
            "$url/$WEAVER_VERSION/weaver-x86_64-unknown-linux-gnu.tar.xz" \
            | sudo tar -xJ -C /usr/local/bin --strip-components=1 \
              --wildcards '*/weaver'
          weaver --version

      - name: Cache the semconv registries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/otel-conformance/semconv
          key: semconv-${{ hashFiles('tools/**/versions.env') }}

      # The report imports each domain runner to read its registry declarations.
      - name: Install the report tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -e tools/runner \
            -e tools/database/runner \
            -e tools/gen-ai/mock-server \
            -e tools/gen-ai/runner \
            -e tools/http/mock-server \
            -e tools/http/test-client/python \
            -e tools/http/runner \
            -e tools/report

      - name: Keep the committed report to diff against
        run: cp docs/data/conformance.json "$RUNNER_TEMP/base.json"

      - name: Rebuild the report
        run: otel-conformance-report build

      # `markdown` rebuilds the report using the now-cached registries.
      - name: Summarise
        run: |
          otel-conformance-report markdown \
            --against "$RUNNER_TEMP/base.json" \
            | tee "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Check for changes
        id: diffcheck
        run: |
          git add docs/data/conformance.json
          if git diff --cached --quiet; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          fi

      # Use otelbot to trigger PR checks; with GITHUB_TOKEN, a maintainer must
      # close and reopen the PR to trigger them.
      # https://github.com/open-telemetry/admin/blob/main/scripts/create_otelbot_app.py
      - name: Mint an otelbot token
        id: otelbot
        if: steps.diffcheck.outputs.has_diff == 'true' && vars.OTELBOT_SEMANTIC_CONVENTIONS_CONFORMANCE_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.OTELBOT_SEMANTIC_CONVENTIONS_CONFORMANCE_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_SEMANTIC_CONVENTIONS_CONFORMANCE_PRIVATE_KEY }}
          # Limit the token to the permissions needed to update the PR.
          permission-contents: write
          permission-pull-requests: write

      - name: Commit and push changes
        if: steps.diffcheck.outputs.has_diff == 'true'
        env:
          GH_TOKEN: ${{ steps.otelbot.outputs.token || github.token }}
          USE_OTELBOT: ${{ steps.otelbot.outputs.token != '' }}
        run: |
          if [ "$USE_OTELBOT" = "true" ]; then
            git config user.name "otelbot"
            git config user.email "197425009+otelbot@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          gh auth setup-git
          git checkout -B "$REPORT_BRANCH"
          git commit -m "chore: update the conformance report"
          # Include any workflow changes that landed during the build before pushing.
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            echo "::error::Failed to merge the latest main into the report update."
            git merge --abort
            exit 1
          fi
          git push --force origin "$REPORT_BRANCH"

      - name: Create or update the pull request
        if: steps.diffcheck.outputs.has_diff == 'true'
        env:
          GH_TOKEN: ${{ steps.otelbot.outputs.token || github.token }}
        run: |
          pr_url=$(gh pr list --state open --head "$REPORT_BRANCH" --base main --json url --jq '.[0].url')
          if [ -z "$pr_url" ]; then
            gh pr create \
              --title "chore: update the conformance report" \
              --body-file "$RUNNER_TEMP/summary.md" \
              --head "$REPORT_BRANCH" \
              --base main
          else
            gh pr edit "$pr_url" --body-file "$RUNNER_TEMP/summary.md"
          fi
