name: Renovate data autofix

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] only validated data patches reach the write-token steps
    workflows: [Runner]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  apply:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.actor.login == 'renovate[bot]' &&
      startsWith(github.event.workflow_run.head_branch, 'renovate/') &&
      github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-latest
    steps:
      - name: Validate the pull request
        id: pull-request
        env:
          EXPECTED_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pull_request="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          jq -e \
            --arg branch "$EXPECTED_HEAD_BRANCH" \
            --arg repository "$REPOSITORY" \
            --arg sha "$EXPECTED_HEAD_SHA" \
            '
              .state == "open" and
              .user.login == "renovate[bot]" and
              .base.repo.full_name == $repository and
              .head.repo.full_name == $repository and
              .head.ref == $branch and
              .head.sha == $sha
            ' <<< "$pull_request"
          echo "branch=$EXPECTED_HEAD_BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$EXPECTED_HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: target
          persist-credentials: false
          ref: ${{ steps.pull-request.outputs.sha }}

      - name: Download generated data patches
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/renovate-data-patches
          pattern: renovate-data-*
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate and apply generated data patches
        id: apply-patches
        env:
          PATCHES_DIR: ${{ runner.temp }}/renovate-data-patches
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          patches=("$PATCHES_DIR"/**/*.patch)
          if (( ${#patches[@]} == 0 )); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git -C target apply \
            --check \
            --whitespace=nowarn \
            --include='scenarios/**/data.json' \
            --exclude='*' \
            "${patches[@]}"
          git -C target apply \
            --whitespace=nowarn \
            --include='scenarios/**/data.json' \
            --exclude='*' \
            "${patches[@]}"

          if [[ -n "$(git -C target diff --summary --)" ]]; then
            echo "::error::generated data patches must not create, remove, rename, or change the mode of files"
            exit 1
          fi

          changed=false
          while IFS= read -r -d '' path; do
            if [[ "$path" != scenarios/*/data.json ]]; then
              echo "::error::generated data patch modified a disallowed path: $path"
              exit 1
            fi
            if [[ ! -f "target/$path" || -L "target/$path" ]]; then
              echo "::error::generated data patch target is not a regular file: $path"
              exit 1
            fi
            jq empty "target/$path"
            changed=true
          done < <(git -C target diff --name-only -z --)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Recheck the pull request head
        if: steps.apply-patches.outputs.changed == 'true'
        env:
          EXPECTED_HEAD_BRANCH: ${{ steps.pull-request.outputs.branch }}
          EXPECTED_HEAD_SHA: ${{ steps.pull-request.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pull_request="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          jq -e \
            --arg branch "$EXPECTED_HEAD_BRANCH" \
            --arg repository "$REPOSITORY" \
            --arg sha "$EXPECTED_HEAD_SHA" \
            '
              .state == "open" and
              .user.login == "renovate[bot]" and
              .base.repo.full_name == $repository and
              .head.repo.full_name == $repository and
              .head.ref == $branch and
              .head.sha == $sha
            ' <<< "$pull_request"

      - name: Create an otelbot token
        if: steps.apply-patches.outputs.changed == 'true'
        id: otelbot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.OTELBOT_SEMCONV_CONFORMANCE_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_SEMCONV_CONFORMANCE_PRIVATE_KEY }}
          permission-contents: write

      - name: Resolve the otelbot identity
        if: steps.apply-patches.outputs.changed == 'true'
        id: otelbot-identity
        env:
          APP_SLUG: ${{ steps.otelbot-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.otelbot-token.outputs.token }}
        run: echo "user-id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Commit and push the generated data
        if: steps.apply-patches.outputs.changed == 'true'
        env:
          APP_SLUG: ${{ steps.otelbot-token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.otelbot-identity.outputs.user-id }}
          GH_TOKEN: ${{ steps.otelbot-token.outputs.token }}
          HEAD_BRANCH: ${{ steps.pull-request.outputs.branch }}
        working-directory: target
        run: |
          set -euo pipefail
          git config core.hooksPath /dev/null
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add -- ':(glob)scenarios/**/data.json'
          git commit --no-verify -m "Update generated data files"
          gh auth setup-git
          git push --no-verify origin "HEAD:refs/heads/$HEAD_BRANCH"
