name: Zizmor GitHub Actions Security Analysis

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '51 18 * * 5' # weekly at 18:51 (UTC) on Friday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    name: Zizmor Security Analysis
    permissions:
      contents: read # for actions/checkout
      security-events: write # for zizmor to upload SARIF results
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@9ba7b96740beb68158e4f1cdfd10a3b794364711 # v0.8.0
    with:
      use-cncf-hosted-runner: true
