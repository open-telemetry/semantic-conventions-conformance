name: Conformance

on:
  push:
    branches: [main]
    paths:
      - 'http/**'
      - 'src/semconv_conformance/**'
      - 'pyproject.toml'
      - 'versions.env'
      - '.github/**'
  pull_request:
    branches: [main]
    paths:
      - 'http/**'
      - 'src/semconv_conformance/**'
      - 'pyproject.toml'
      - 'versions.env'
      - '.github/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover-scenarios:
    name: Discover scenarios
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install semconv-conformance
        run: pip install -e .

      - name: Generate matrix
        id: matrix
        run: semconv-ci-matrix all >> "$GITHUB_OUTPUT"

  run-scenarios:
    needs: discover-scenarios
    name: ${{ matrix.domain }} / ${{ matrix.language }} / ${{ matrix.lib }}-${{ matrix.eco }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-scenarios.outputs.matrix) }}
    uses: ./.github/workflows/_run-language-scenarios.yml
    with:
      domain: ${{ matrix.domain }}
      language: ${{ matrix.language }}
      lib: ${{ matrix.lib }}
      eco: ${{ matrix.eco }}
      runner: ${{ matrix.runner }}
