name: Renovate autofix

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] the job only handles same-repository Renovate pull requests
    workflows: [Runner]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  # We validate the input of this workflow (origin, caused by a push from Renovate bot)
  # before proceeding to the high-privilege section (git push).
  # This check also prevents infinite loops where a push by the otelbot failing CI triggers another autofix run.
  apply:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.actor.login == 'renovate[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download regenerated lock file patches
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/renovate-lock-patches
          pattern: renovate-lock-*
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download generated data patches
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/renovate-data-patches
          pattern: renovate-data-*
          run-id: ${{ github.event.workflow_run.id }}

      # Two layers on the PR head: the lock files first, since the data was
      # generated against them, then data.json. Each layer is output only if
      # it changes the tree below it.
      #
      # `git apply --include/--exclude` filters a rename on its new path
      # only (its old path is not checked), so a rename can move a tracked
      # file to an allowlisted path -- or move an allowlisted file out from
      # under itself -- without the filter ever seeing an excluded name. It
      # also has no opinion on file mode, so the same filter lets a patch
      # turn an allowlisted path into an executable or a symlink. And if
      # every hunk in a patch is filtered out, `git apply` succeeds as a
      # silent no-op rather than failing. The include/exclude filter is
      # therefore only a first pass, not the security boundary: after each
      # layer, the resulting tree is diffed against the tree below it and
      # every changed entry is re-checked against the same allowlist below.
      - name: Apply generated patches
        id: apply-patches
        env:
          GIT_INDEX_FILE: ${{ runner.temp }}/renovate-autofix.index
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          LOCK_PATCHES_DIR: ${{ runner.temp }}/renovate-lock-patches
          DATA_PATCHES_DIR: ${{ runner.temp }}/renovate-data-patches
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          # Verify that every tree entry that differs between $1 (the lower
          # tree) and $2 (the upper tree) is a plain-file change at mode
          # 100644, with a status matching $3 (a regex: the lock layer only
          # ever rewrites tracked files, so it is restricted to `^M$`; the
          # data layer may also create a fresh data.json, so it allows
          # `^[AM]$`), whose path matches the layer's allowlist regex $4.
          # Rejects renames, deletes, type changes (e.g. symlinks) and mode
          # changes that the `git apply` include/exclude filter does not
          # catch on its own.
          #
          # `git diff-tree` is run as an ordinary command into a file first,
          # not as a `done < <(...)` process substitution: a failing process
          # substitution's exit status is invisible to the loop and to
          # `set -e`, which would let a diff-tree error pass the layer
          # unchecked.
          verify_layer() {
            local lower="$1" upper="$2" status_regex="$3" path_regex="$4"
            local meta path new_mode status
            local diff_file="$RUNNER_TEMP/verify-layer-diff-$$.raw"
            git diff-tree -r --no-renames --raw -z "$lower" "$upper" \
              > "$diff_file"
            while IFS= read -r -d '' meta && IFS= read -r -d '' path; do
              # ":<old mode> <new mode> <old sha> <new sha> <status>"
              read -r _ new_mode _ _ status <<<"${meta#:}"
              if [[ ! "$status" =~ $status_regex ]]; then
                echo "::error::autofix layer rejected: $path has status" \
                     "'$status' (expected $status_regex)"
                exit 1
              fi
              if [[ "$new_mode" != "100644" ]]; then
                echo "::error::autofix layer rejected: $path has mode" \
                     "'$new_mode' (expected 100644)"
                exit 1
              fi
              if [[ ! "$path" =~ $path_regex ]]; then
                echo "::error::autofix layer rejected: $path is outside" \
                     "the allowlist"
                exit 1
              fi
            done < "$diff_file"
            rm -f "$diff_file"
          }

          lock_allow='^(scenarios|tools)/(.+/)?(package-lock\.json|go\.mod|go\.sum|uv\.lock|Gemfile\.lock|composer\.lock)$'
          data_allow='^scenarios/(.+/)?data\.json$'

          lock_patches=("$LOCK_PATCHES_DIR"/**/*.patch)
          data_patches=("$DATA_PATCHES_DIR"/**/*.patch)
          if (( ${#lock_patches[@]} + ${#data_patches[@]} == 0 )); then
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          git read-tree "$HEAD_SHA"
          head_tree="$(git write-tree)"

          if (( ${#lock_patches[@]} > 0 )); then
            includes=()
            for root in scenarios tools; do
              for name in package-lock.json go.mod go.sum uv.lock \
                          Gemfile.lock composer.lock; do
                includes+=("--include=$root/**/$name")
              done
            done
            git apply --cached "${includes[@]}" --exclude='*' \
              "${lock_patches[@]}"
          fi
          lock_tree="$(git write-tree)"
          if [[ "$lock_tree" != "$head_tree" ]]; then
            verify_layer "$head_tree" "$lock_tree" '^M$' "$lock_allow"
            echo "lock_tree=$lock_tree" >> "$GITHUB_OUTPUT"
          fi

          if (( ${#data_patches[@]} > 0 )); then
            git apply --cached \
              --include='scenarios/**/data.json' \
              --exclude='*' \
              "${data_patches[@]}"
          fi
          data_tree="$(git write-tree)"
          if [[ "$data_tree" != "$lock_tree" ]]; then
            verify_layer "$lock_tree" "$data_tree" '^[AM]$' "$data_allow"
            echo "data_tree=$data_tree" >> "$GITHUB_OUTPUT"
          fi

      - name: Create an otelbot token
        if: >-
          steps.apply-patches.outputs.lock_tree != '' ||
          steps.apply-patches.outputs.data_tree != ''
        id: otelbot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.OTELBOT_SEMCONV_CONFORMANCE_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_SEMCONV_CONFORMANCE_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit and push the generated files
        if: >-
          steps.apply-patches.outputs.lock_tree != '' ||
          steps.apply-patches.outputs.data_tree != ''
        env:
          GH_TOKEN: ${{ steps.otelbot-token.outputs.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          LOCK_TREE: ${{ steps.apply-patches.outputs.lock_tree }}
          DATA_TREE: ${{ steps.apply-patches.outputs.data_tree }}
        # Both commits go out in one push, so the PR gets one CI run.
        run: |
          set -euo pipefail
          git config user.name "otelbot-semconv-conformance[bot]"
          git config user.email "332156698+otelbot-semconv-conformance[bot]@users.noreply.github.com"
          parent="$HEAD_SHA"
          if [[ -n "$LOCK_TREE" ]]; then
            parent="$(printf '%s\n' "Update lock files" |
              git commit-tree "$LOCK_TREE" -p "$parent")"
          fi
          if [[ -n "$DATA_TREE" ]]; then
            parent="$(printf '%s\n' "Update generated data files" |
              git commit-tree "$DATA_TREE" -p "$parent")"
          fi
          gh auth setup-git
          git push \
            --no-verify \
            --force-with-lease="refs/heads/$HEAD_BRANCH:$HEAD_SHA" \
            origin \
            "$parent:refs/heads/$HEAD_BRANCH"
