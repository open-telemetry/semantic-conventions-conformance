name: uv lock regeneration experiment

on:
  push:
    branches:
      - trask-pr-445-ci-failure
    paths:
      - .github/workflows/uv-lock-experiment.yml

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false

      - name: Delete and regenerate every tracked uv.lock
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tomllib
          import zipfile

          root = Path.cwd()
          output = Path(os.environ["RUNNER_TEMP"]) / "uv-lock-experiment"
          output.mkdir()
          tracked = subprocess.run(
              ["git", "ls-files", "-z", "--", "uv.lock", ":(glob)**/uv.lock"],
              capture_output=True, check=True,
          ).stdout.decode().split("\0")
          paths = [Path(name) for name in sorted(tracked) if name]
          assert paths
          originals = {str(path): path.read_bytes() for path in paths}

          def digest(content):
              return hashlib.sha256(content).hexdigest()

          def packages(content):
              lock = tomllib.loads(content.decode())
              return {
                  f"{package['name']}=={package.get('version', 'local')}"
                  for package in lock["package"]
              }

          def run_uv(project, label, offline=False):
              command = ["uv", "lock", "--directory", str(project)]
              if offline:
                  command.append("--offline")
              result = subprocess.run(command, capture_output=True, text=True)
              log = output / (str(project).replace("/", "__") + f"-{label}.log")
              log.write_text(result.stdout + result.stderr)
              if result.returncode:
                  print(result.stdout, end="")
                  print(result.stderr, end="", file=sys.stderr)
              return result.returncode

          bedrock = Path("scenarios/gen-ai/python/bedrock/openinference")
          control_status = run_uv(bedrock, "existing-lock")
          control_bytes = (bedrock / "uv.lock").read_bytes()
          control = {
              "exit_code": control_status,
              "unchanged": control_bytes == originals[str(bedrock / "uv.lock")],
              "wrapt_versions": sorted(
                  entry for entry in packages(control_bytes)
                  if entry.startswith("wrapt==")
              ),
          }
          (output / "bedrock-control.lock").write_bytes(control_bytes)

          for path in paths:
              path.unlink()
          assert all(not path.exists() for path in paths)

          results = []
          failed = control_status != 0
          for path in paths:
              print(f"::group::{path.parent}", flush=True)
              status = run_uv(path.parent, "fresh")
              record = {"path": str(path), "exit_code": status}
              if status:
                  failed = True
                  print(f"::error::Failed to regenerate {path}")
              else:
                  assert path.exists()
                  generated = path.read_bytes()
                  repeat_status = run_uv(path.parent, "repeat", offline=True)
                  stable = repeat_status == 0 and path.read_bytes() == generated
                  old_packages = packages(originals[str(path)])
                  new_packages = packages(generated)
                  record.update({
                      "original_sha256": digest(originals[str(path)]),
                      "generated_sha256": digest(generated),
                      "unchanged": originals[str(path)] == generated,
                      "removed_packages": sorted(old_packages - new_packages),
                      "added_packages": sorted(new_packages - old_packages),
                      "repeat_exit_code": repeat_status,
                      "repeat_unchanged": stable,
                  })
                  if not stable:
                      failed = True
                      print(f"::error::Repeat uv lock changed or failed for {path}")
                  print(json.dumps(record), flush=True)
              results.append(record)
              print("::endgroup::", flush=True)

          metadata = {
              "commit": os.environ["GITHUB_SHA"],
              "python": sys.version,
              "uv": subprocess.run(
                  ["uv", "--version"], capture_output=True, text=True, check=True,
              ).stdout.strip(),
              "bedrock_existing_lock": control,
              "results": results,
          }
          (output / "results.json").write_text(json.dumps(metadata, indent=2) + "\n")
          diff = subprocess.run(
              ["git", "diff", "--binary", "--", *map(str, paths)],
              capture_output=True, check=True,
          ).stdout
          (output / "locks.patch").write_bytes(diff)
          with zipfile.ZipFile(
              output / "regenerated-locks.zip", "w", zipfile.ZIP_DEFLATED,
          ) as archive:
              for path in paths:
                  if path.exists():
                      archive.write(path, str(path))
          summary = [
              "## uv lock regeneration experiment",
              f"Deleted {len(paths)} tracked locks before regeneration.",
              f"Python: `{sys.version.split()[0]}`. uv: `{metadata['uv']}`.",
              f"Existing Bedrock lock control: `{json.dumps(control)}`.",
              "",
              "| Lock | Fresh generation | Matches original | Repeat unchanged |",
              "| --- | --- | --- | --- |",
          ]
          for result in results:
              summary.append(
                  f"| `{result['path']}` | {result['exit_code']} | "
                  f"{result.get('unchanged', 'N/A')} | "
                  f"{result.get('repeat_unchanged', 'N/A')} |"
              )
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(summary) + "\n")
          sys.exit(1 if failed else 0)

      - name: Save generated locks, comparison, and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uv-lock-experiment
          path: ${{ runner.temp }}/uv-lock-experiment
          if-no-files-found: error
          retention-days: 7
