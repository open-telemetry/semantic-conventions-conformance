[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otel-http-mock-server"
version = "0.1.0.dev0"
description = "Serves the HTTP conformance route contract, for client-side scenarios to call."
requires-python = ">=3.10"
# The contract only, which is standard library itself: this process must stay
# uninstrumentable, and a dependency of its own could be picked up by
# zero-code instrumentation.
dependencies = ["otel-http-test-client"]

[project.scripts]
http-mock-server = "http_mock_server:main"

# Not on PyPI; install it editable from a checkout.
[tool.uv.sources]
otel-http-test-client = { path = "../test-client/python", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/http_mock_server"]
