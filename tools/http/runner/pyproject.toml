[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "http-conformance"
version = "0.1.0.dev0"
description = "Conformance runs against the OpenTelemetry HTTP semantic conventions."
requires-python = ">=3.10"
dependencies = [
  "opentelemetry-conformance",
  # Client-side scenarios call it; a directory declares it under `server:`.
  "otel-http-mock-server",
]

# What a `runner: http-conformance` directory resolves to.
[project.entry-points.opentelemetry_conformance_runners]
http-conformance = "http_conformance:http_session"

[project.scripts]
http-conformance = "http_conformance:cli"

# Not on PyPI; install it editable from a checkout.
[tool.uv.sources]
opentelemetry-conformance = { path = "../../runner", editable = true }
otel-http-mock-server = { path = "../mock-server", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/http_conformance"]
