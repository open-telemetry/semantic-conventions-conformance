[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otel-http-test-client"
version = "0.1.0.dev0"
description = "The HTTP conformance exchanges a server answers or a client sends."
requires-python = ">=3.10"
dependencies = ["PyYAML >= 6, < 7"]

[project.scripts]
otel-http-drive = "otel_http_test_client.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/otel_http_test_client"]

# The server contract is what this driver drives, and it belongs to every
# language rather than to this package, so it lives outside it. A built wheel
# carries a copy; an editable install reads it where it is, which is what
# ``_contract_path`` falls back to.
[tool.hatch.build.targets.wheel.force-include]
"../../contracts/server.yaml" = "otel_http_test_client/server.yaml"
