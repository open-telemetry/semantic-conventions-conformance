scenarios:
  client:
    spans:
      - match:
          kind: CLIENT
          attributes:
            http.request.method: GET
            http.response.status_code: 200
        expect:
          count: 2
          attributes:
            url.full: {present: true}
      - match:
          kind: CLIENT
          attributes:
            http.request.method: POST
            http.response.status_code: 201
        expect:
          count: 1
          attributes:
            url.full: {present: true}
      - match:
          kind: CLIENT
          attributes:
            http.request.method: GET
            http.response.status_code: 404
        expect:
          count: 1
          attributes:
            url.full: {present: true}
      - match:
          kind: CLIENT
          attributes:
            http.request.method: GET
            http.response.status_code: 500
        expect:
          count: 1
          attributes:
            url.full: {present: true}
    events: []
