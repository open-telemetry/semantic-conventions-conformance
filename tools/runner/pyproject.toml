[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opentelemetry-conformance"
version = "0.1.0.dev0"
description = "Runs scenario programs and checks what they emit against semantic conventions, through Weaver live-check."
requires-python = ">=3.10"
dependencies = [
  "grpcio >= 1.66, <2",
  "opentelemetry-proto >= 1.27, <2",
  # opentelemetry.test.weaver_live_check — imported lazily by the session.
  "opentelemetry-test-utils >= 0.65b0, <1",
  "PyYAML >= 6.0.2",
]

[project.optional-dependencies]
pytest = [
  "pytest >= 8",
]

# Lets `pytest` collect conformance.yaml files and run their scenarios.
[project.entry-points.pytest11]
conformance = "opentelemetry.conformance.pytest_plugin"

[project.scripts]
otel-conformance = "opentelemetry.conformance._cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/opentelemetry"]
