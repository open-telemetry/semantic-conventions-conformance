#
# Findings filtered out for every domain. Used unless a domain or a caller
# declares a weaver config of its own, which replaces this file.

# Resource attributes the OTel SDK sets, which belong to no domain registry —
# see https://github.com/open-telemetry/weaver/issues/1456.
[[live-check.finding_filters]]
signal_type = "resource"
exclude_samples = [
  "service.name",
  "service.instance.id",
  "telemetry.sdk.language",
  "telemetry.sdk.name",
  "telemetry.sdk.version",
  "telemetry.auto.version",
]

# Java SDK 1.64 autoconfigure has no property to disable only its legacy
# self-telemetry; disabling metric export would also hide application metrics.
# Keep the pre-semconv metric out of every domain's findings here instead.
[[live-check.finding_filters]]
signal_type = "metric"
exclude = ["missing_metric"]
sample_names = ["queueSize"]

[[live-check.finding_filters]]
signal_type = "metric"
exclude = ["missing_attribute"]
sample_names = ["processorType"]
