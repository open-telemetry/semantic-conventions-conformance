#
# Emits {signal -> {attribute -> requirement level}} for the registry. The
# coverage reduction intersects the attribute names with what a run emitted;
# the levels are for readers of the model, since a missing required attribute
# is a weaver violation rather than a coverage gap.
#
# Provider refinements (openai.inference.client refines gen_ai.inference.client)
# are ignored: only a signal's own definition is modelled, so a provider's
# attributes are not coverage of the general span type.
templates:
  - template: "coverage-model.json.j2"
    application_mode: single
    filter: |
      # A conditional level is written {conditionally_required: "when ..."}.
      def level: if type == "object" then (keys[0] + "_conditional") else . end;

      def attributes:
        [.attributes[]? | {key: .key, value: (.requirement_level | level)}]
        | from_entries;

      def enums:
        [
          .registry.attributes[]? | select(.type | type == "object" and .members) | {
             key: .key,
             value: [.type.members[]?.value]
          }
        ] | from_entries;

      def entity_identity:
        [.identity[]? | {key: .key, value: (.requirement_level | level)}]
        | from_entries;

      def entity_description:
        [.description[]? | {key: .key, value: (.requirement_level | level)}]
        | from_entries;

      # A signal's own definition has id == the name it declares; anything
      # else under the same name is a refinement, and is dropped.
      {
        spans: ([.refinements.spans[]? | select(.id == .type)] | map({
          key: .type,
          value: {kind: .kind, attributes: attributes},
        }) | from_entries),
        events: ([.refinements.events[]? | select(.id == .name)] | map({
          key: .name,
          value: {attributes: attributes},
        }) | from_entries),
        metrics: ([.refinements.metrics[]? | select(.id == .name)] | map({
          key: .name,
          value: {attributes: attributes},
        }) | from_entries),
        enums: enums,
        entities: ([.refinements.entities[]? | select(.id == .type)] | map({
          key: .type,
          value: {
            identity: entity_identity,
            description: entity_description,
          },
        }) | from_entries),
      }
