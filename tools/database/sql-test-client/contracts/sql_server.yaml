backend: sql_server
description: The SQL scenarios every language executes against Microsoft SQL Server.

scenarios:
  - description: Runs a direct query.
    action:
      kind: query
      sql: SELECT CASE WHEN count(*) >= 0 THEN CAST(1 AS bit) ELSE CAST(0 AS bit) END FROM conformance.items
    expect:
      spans:
        - match:
            attributes:
              db.system.name: microsoft.sql_server
          expect:
            count: 1
            attributes:
              db.namespace: conformance
              db.query.summary: SELECT conformance.items
              db.query.text: SELECT CASE WHEN count(*) >= ? THEN CAST(? AS bit) ELSE CAST(? AS bit) END FROM conformance.items
              server.address: 127.0.0.1
              server.port:
                present: true
      metrics:
        - db.client.operation.duration
      events: []

  - description: Binds an integer to a prepared query.
    action:
      kind: prepared_query
      sql: SELECT name FROM conformance.items WHERE id = ${1}
      parameters:
        - type: integer
          value: -1
    expect:
      spans:
        - match:
            attributes:
              db.system.name: microsoft.sql_server
          expect:
            count: 1
            attributes:
              db.namespace: conformance
              db.query.summary: SELECT conformance.items
              db.query.text: SELECT name FROM conformance.items WHERE id = ?
              server.address: 127.0.0.1
              server.port:
                present: true
      metrics:
        - db.client.operation.duration
      events: []

  - description: Executes two inserts as one batch.
    action:
      kind: batch
      statements:
        - INSERT INTO conformance.items (id, name) VALUES (1, 'first')
        - INSERT INTO conformance.items (id, name) VALUES (2, 'second')
    expect:
      spans:
        - match:
            attributes:
              db.system.name: microsoft.sql_server
          expect:
            count: 1
            attributes:
              db.namespace: conformance
              db.operation.batch.size: 2
              db.query.summary: BATCH INSERT conformance.items
              db.query.text: INSERT INTO conformance.items (id, name) VALUES (?, ?)
              server.address: 127.0.0.1
              server.port:
                present: true
      metrics:
        - db.client.operation.duration
      events: []

  - description: Calls the no-op stored procedure.
    action:
      kind: stored_procedure
      sql: "{call conformance.noop}"
    expect:
      spans:
        - match:
            attributes:
              db.system.name: microsoft.sql_server
          expect:
            count: 1
            attributes:
              db.namespace: conformance
              db.query.summary: call conformance.noop
              db.query.text: "{call conformance.noop}"
              db.stored_procedure.name: conformance.noop
              server.address: 127.0.0.1
              server.port:
                present: true
      metrics:
        - db.client.operation.duration
      events: []
