backend: oracle
description: The SQL scenarios every language executes against Oracle Database.

scenarios:
  - description: Runs a direct query.
    action:
      kind: query
      sql: SELECT CASE WHEN count(*) >= 0 THEN 1 ELSE 0 END FROM conformance.items
    expect:
      spans:
        - match:
            attributes:
              db.system.name: oracle.db
          expect:
            count: 1
            attributes:
              db.namespace: freepdb1
              db.query.summary: SELECT conformance.items
              db.query.text: SELECT CASE WHEN count(*) >= ? THEN ? ELSE ? END FROM conformance.items
              server.address: 127.0.0.1
              server.port:
                present: true
      metrics:
        - db.client.operation.duration
        - queueSize
      events: []

  - description: Binds an integer to a prepared query.
    action:
      kind: prepared_query
      sql: SELECT name FROM conformance.items WHERE id = ${1}
      parameters:
        - type: integer
          value: -1
    expect:
      spans:
        - match:
            attributes:
              db.system.name: oracle.db
          expect:
            count: 1
            attributes:
              db.namespace: freepdb1
              db.query.summary: SELECT conformance.items
              db.query.text: SELECT name FROM conformance.items WHERE id = ?
              server.address: 127.0.0.1
              server.port:
                present: true
      metrics:
        - db.client.operation.duration
        - queueSize
      events: []

  - description: Executes two inserts as one batch.
    action:
      kind: batch
      statements:
        - INSERT INTO conformance.items (id, name) VALUES (1, 'first')
        - INSERT INTO conformance.items (id, name) VALUES (2, 'second')
    expect:
      spans:
        - match:
            attributes:
              db.system.name: oracle.db
          expect:
            count: 1
            attributes:
              db.namespace: freepdb1
              db.operation.batch.size: 2
              db.query.summary: BATCH INSERT conformance.items
              db.query.text: INSERT INTO conformance.items (id, name) VALUES (?, ?)
              server.address: 127.0.0.1
              server.port:
                present: true
      metrics:
        - db.client.operation.duration
        - queueSize
      events: []

  - description: Calls the no-op stored procedure.
    action:
      kind: stored_procedure
      sql: '{call conformance.noop()}'
    expect:
      spans:
        - match:
            attributes:
              db.system.name: oracle.db
          expect:
            count: 1
            attributes:
              db.namespace: freepdb1
              db.query.summary: call conformance.noop
              db.query.text: '{call conformance.noop()}'
              db.stored_procedure.name: conformance.noop
              server.address: 127.0.0.1
              server.port:
                present: true
      metrics:
        - db.client.operation.duration
        - queueSize
      events: []
