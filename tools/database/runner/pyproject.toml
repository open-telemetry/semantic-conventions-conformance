[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "database-conformance"
version = "0.1.0.dev0"
description = "Conformance runs against the OpenTelemetry database semantic conventions."
requires-python = ">=3.10"
dependencies = [
  "docker >= 7, < 8",
  "opentelemetry-conformance",
  "testcontainers >= 4.15, < 5",
]

[project.entry-points.opentelemetry_conformance_runners]
database-conformance = "database_conformance:database_session"

[project.scripts]
database-conformance = "database_conformance:cli"

[tool.uv.sources]
opentelemetry-conformance = { path = "../../runner", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/database_conformance"]
