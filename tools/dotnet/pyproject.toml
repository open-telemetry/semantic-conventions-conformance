[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otel-conformance-dotnet"
version = "0.1.0.dev0"
description = "Builds and runs .NET conformance scenarios, so no conformance.yaml restates the toolchain."
requires-python = ">=3.10"
# Standard library only: it starts the scenario process, so anything it
# imported would be one more thing that could end up in a run.
dependencies = []

[project.scripts]
otel-conformance-dotnet = "otel_conformance_dotnet:main"

[tool.hatch.build.targets.wheel]
packages = ["src/otel_conformance_dotnet"]
